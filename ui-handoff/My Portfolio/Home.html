<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Raaj Patre — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&family=Press+Start+2P&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg-base:        #0a0c1a;
    --bg-surface:     #12152b;
    --bg-elevated:    #1a1e38;
    --text-primary:   #e8e8f0;
    --text-muted:     #6b7094;
    --accent-gold:    #f5c542;
    --accent-violet:  #7c6df5;
    --accent-teal:    #3dd6ac;
    --accent-red:     #f55c5c;
    --border-pixel:   #2a2d4a;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg-base);
    color: var(--text-primary);
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 14px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    image-rendering: pixelated;
    overflow-x: hidden;
    min-height: 100vh;
  }

  .pixel  { font-family: "Press Start 2P", "JetBrains Mono", monospace; letter-spacing: 0.02em; }
  .mono   { font-family: "JetBrains Mono", monospace; }

  /* ---------- STAR FIELD ---------- */
  .stars {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(124,109,245,0.06), transparent 50%),
      radial-gradient(ellipse at 80% 90%, rgba(61,214,172,0.04), transparent 50%),
      var(--bg-base);
  }
  .stars::before,
  .stars::after,
  .stars > .layer {
    content: "";
    position: absolute;
    top: -50%;
    left: 0;
    width: 100%;
    height: 200%;
    background-repeat: repeat;
  }
  .stars::before {
    /* small dim stars, slow drift */
    background-image:
      radial-gradient(1px 1px at 23px 47px, rgba(232,232,240,0.55), transparent 60%),
      radial-gradient(1px 1px at 89px 132px, rgba(232,232,240,0.4), transparent 60%),
      radial-gradient(1px 1px at 167px 211px, rgba(232,232,240,0.6), transparent 60%),
      radial-gradient(1px 1px at 234px 88px, rgba(232,232,240,0.35), transparent 60%),
      radial-gradient(1px 1px at 312px 256px, rgba(232,232,240,0.5), transparent 60%),
      radial-gradient(1px 1px at 401px 174px, rgba(232,232,240,0.45), transparent 60%),
      radial-gradient(1px 1px at 67px 312px, rgba(232,232,240,0.3), transparent 60%),
      radial-gradient(1px 1px at 198px 360px, rgba(232,232,240,0.55), transparent 60%),
      radial-gradient(1px 1px at 355px 33px, rgba(232,232,240,0.4), transparent 60%),
      radial-gradient(1px 1px at 280px 410px, rgba(232,232,240,0.45), transparent 60%);
    background-size: 480px 480px;
    animation: drift 120s linear infinite;
    opacity: 0.85;
  }
  .stars::after {
    /* medium 1.5px stars, mid speed */
    background-image:
      radial-gradient(1.5px 1.5px at 55px 90px, rgba(232,232,240,0.7), transparent 60%),
      radial-gradient(1.5px 1.5px at 220px 30px, rgba(124,109,245,0.6), transparent 60%),
      radial-gradient(1.5px 1.5px at 380px 220px, rgba(232,232,240,0.5), transparent 60%),
      radial-gradient(1.5px 1.5px at 140px 280px, rgba(61,214,172,0.5), transparent 60%),
      radial-gradient(1.5px 1.5px at 460px 380px, rgba(232,232,240,0.6), transparent 60%),
      radial-gradient(1.5px 1.5px at 310px 460px, rgba(232,232,240,0.45), transparent 60%);
    background-size: 540px 540px;
    animation: drift 80s linear infinite reverse;
    opacity: 0.8;
  }
  .stars > .layer {
    /* big 2px bright stars, faster */
    background-image:
      radial-gradient(2px 2px at 110px 60px, rgba(245,197,66,0.7), transparent 60%),
      radial-gradient(2px 2px at 340px 140px, rgba(232,232,240,0.85), transparent 60%),
      radial-gradient(2px 2px at 250px 320px, rgba(124,109,245,0.7), transparent 60%),
      radial-gradient(2px 2px at 470px 460px, rgba(232,232,240,0.8), transparent 60%),
      radial-gradient(2px 2px at 80px 440px, rgba(61,214,172,0.6), transparent 60%);
    background-size: 600px 600px;
    animation: drift 55s linear infinite, twinkle 4s ease-in-out infinite;
    opacity: 0.9;
  }
  @keyframes drift {
    from { transform: translate3d(0, 0, 0); }
    to   { transform: translate3d(-40px, 80px, 0); }
  }
  @keyframes twinkle {
    0%, 100% { filter: brightness(1); }
    50%      { filter: brightness(0.55); }
  }

  /* ---------- WELCOME OVERLAY ---------- */
  .welcome {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: var(--bg-base);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    gap: 28px;
    transition: opacity 480ms ease, transform 480ms ease;
  }
  .welcome.hide {
    opacity: 0;
    transform: translateY(-12px);
    pointer-events: none;
  }
  .welcome-inner {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    max-width: 560px;
    width: 100%;
    margin-top: -40px;
  }

  /* Character sprite placeholder */
  .sprite-box {
    width: 128px;
    height: 128px;
    border: 2px dashed var(--border-pixel);
    box-shadow: 0 0 0 1px var(--border-pixel);
    background:
      linear-gradient(135deg, rgba(124,109,245,0.06), rgba(61,214,172,0.04)),
      var(--bg-surface);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--text-muted);
    animation: idleBounce 1.2s ease-in-out infinite;
    position: relative;
  }
  .sprite-box .sprite-label {
    font-family: "Press Start 2P", monospace;
    font-size: 8px;
    line-height: 1.6;
    color: var(--text-muted);
    padding: 0 8px;
  }
  .sprite-box::after {
    /* tiny pixel "shadow" beneath sprite */
    content: "";
    position: absolute;
    bottom: -14px;
    left: 50%;
    transform: translateX(-50%);
    width: 80px;
    height: 6px;
    background: rgba(124,109,245,0.18);
    filter: blur(4px);
  }
  @keyframes idleBounce {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-2px); }
  }

  /* Dialogue box */
  .dialogue {
    width: min(520px, 100%);
    background: var(--bg-surface);
    border: 2px solid var(--accent-violet);
    box-shadow: 0 0 20px rgba(124,109,245,0.3), 0 0 0 1px var(--accent-violet);
    border-radius: 2px;
  }
  .dialogue-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border-pixel);
  }
  .dialogue-head .name {
    font-family: "Press Start 2P", monospace;
    font-size: 10px;
    color: var(--accent-gold);
    letter-spacing: 0.04em;
  }
  .dialogue-head .lvl {
    font-family: "Press Start 2P", monospace;
    font-size: 10px;
    color: var(--accent-teal);
  }
  .dialogue-body {
    padding: 18px 18px 16px;
    font-family: "JetBrains Mono", monospace;
    font-size: 13px;
    line-height: 1.8;
    color: var(--text-primary);
    min-height: 130px;
    position: relative;
  }
  .dialogue-body .line { white-space: pre-wrap; }
  .cursor {
    display: inline-block;
    width: 7px;
    height: 14px;
    background: var(--text-primary);
    vertical-align: -2px;
    margin-left: 2px;
    animation: blink 800ms steps(2) infinite;
  }
  .dialogue-body .next {
    position: absolute;
    right: 14px;
    bottom: 10px;
    font-family: "Press Start 2P", monospace;
    font-size: 10px;
    color: var(--accent-violet);
    animation: blink 800ms ease-in-out infinite;
  }
  @keyframes blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  /* Enter button */
  .btn {
    font-family: "Press Start 2P", monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    border: 2px solid var(--accent-violet);
    background: var(--accent-violet);
    color: var(--bg-base);
    padding: 12px 18px;
    cursor: pointer;
    border-radius: 2px;
    box-shadow: 0 0 0 1px var(--accent-violet);
    transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
  }
  .btn:hover {
    transform: scale(1.03);
    box-shadow: 0 0 16px var(--accent-violet), 0 0 0 1px var(--accent-violet);
    filter: brightness(1.08);
  }
  .btn:active { transform: scale(0.99); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: 0 0 0 1px var(--border-pixel); }

  .skip {
    position: absolute;
    top: 18px;
    right: 22px;
    font-family: "Press Start 2P", monospace;
    font-size: 8px;
    color: var(--text-muted);
    background: transparent;
    border: 1px solid var(--border-pixel);
    box-shadow: 0 0 0 1px var(--border-pixel);
    padding: 8px 10px;
    border-radius: 2px;
    cursor: pointer;
  }
  .skip:hover { color: var(--text-primary); border-color: var(--text-muted); }

  .top-strip {
    position: absolute;
    top: 18px;
    left: 22px;
    font-family: "Press Start 2P", monospace;
    font-size: 8px;
    color: var(--text-muted);
  }
  .top-strip .dot {
    display: inline-block; width: 6px; height: 6px;
    background: var(--accent-teal); margin-right: 8px;
    box-shadow: 0 0 8px var(--accent-teal);
    vertical-align: 2px;
  }

  /* ---------- APP / HERO ---------- */
  .app {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    opacity: 0;
    transition: opacity 600ms ease;
  }
  .app.show { opacity: 1; }

  /* ---------- HOME GIF BACKGROUND (after entering) ---------- */
  .home-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background-image: url("assets/home-bg.gif");
    background-size: cover;
    background-position: center;
    image-rendering: pixelated;
    opacity: 0;
    transition: opacity 800ms ease;
  }
  .home-bg.show { opacity: 1; }
  /* Dimming + side-gradient overlay so the hero text stays readable on the bright sky */
  .home-bg::before {
    content: "";
    position: absolute; inset: 0;
    background:
      linear-gradient(
        to right,
        rgba(10,12,26,0.92) 0%,
        rgba(10,12,26,0.78) 30%,
        rgba(10,12,26,0.55) 60%,
        rgba(10,12,26,0.65) 100%
      );
  }
  .home-bg::after {
    content: "";
    position: absolute; inset: 0;
    background:
      linear-gradient(to bottom, rgba(10,12,26,0.55) 0%, rgba(10,12,26,0) 200px),
      linear-gradient(to top,    rgba(10,12,26,0.7)  0%, rgba(10,12,26,0) 220px);
  }
  /* fade out the starfield once the gif is up */
  body.entered .stars { opacity: 0; transition: opacity 800ms ease; pointer-events: none; }

  .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px clamp(20px, 5vw, 64px);
    border-bottom: 1px solid var(--border-pixel);
    background: rgba(10,12,26,0.7);
    backdrop-filter: blur(6px);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .nav .brand {
    font-family: "Press Start 2P", monospace;
    font-size: 11px;
    color: var(--text-primary);
    display: flex; align-items: center; gap: 10px;
  }
  .nav .brand .chip {
    background: var(--accent-violet);
    color: var(--bg-base);
    padding: 4px 6px;
    font-size: 8px;
    box-shadow: 0 0 0 1px var(--accent-violet);
  }
  .nav .links {
    display: flex; gap: 22px;
  }
  .nav .links a {
    font-family: "Press Start 2P", monospace;
    font-size: 9px;
    color: var(--text-muted);
    text-decoration: none;
    letter-spacing: 0.05em;
  }
  .nav .links a:hover { color: var(--text-primary); }
  .nav .save {
    font-family: "Press Start 2P", monospace;
    font-size: 8px;
    color: var(--accent-teal);
    border: 1px solid var(--border-pixel);
    box-shadow: 0 0 0 1px var(--border-pixel);
    padding: 6px 8px;
  }

  .hero {
    position: relative;
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    gap: 48px;
    padding: clamp(40px, 7vw, 96px) clamp(20px, 5vw, 64px) 32px;
    align-items: center;
  }
  @media (max-width: 880px) {
    .hero { grid-template-columns: 1fr; gap: 36px; }
  }

  .eyebrow {
    font-family: "Press Start 2P", monospace;
    font-size: 9px;
    color: var(--accent-teal);
    letter-spacing: 0.12em;
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .eyebrow::before {
    content: "";
    width: 8px; height: 8px;
    background: var(--accent-teal);
    box-shadow: 0 0 10px var(--accent-teal);
  }
  .name {
    font-family: "Press Start 2P", monospace;
    font-size: clamp(22px, 4vw, 32px);
    color: var(--text-primary);
    margin: 18px 0 14px;
    line-height: 1.2;
    text-shadow: 0 0 20px rgba(124,109,245,0.4);
    animation: glowIn 900ms ease-out both;
  }
  @keyframes glowIn {
    from { opacity: 0; text-shadow: 0 0 0 rgba(124,109,245,0); }
    to   { opacity: 1; text-shadow: 0 0 20px rgba(124,109,245,0.4); }
  }
  .role {
    font-family: "Press Start 2P", monospace;
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.08em;
    margin-bottom: 22px;
  }
  .role .sep { color: var(--border-pixel); margin: 0 8px; }
  .one-liner {
    font-family: "JetBrains Mono", monospace;
    font-size: 15px;
    color: var(--text-primary);
    font-style: italic;
    max-width: 420px;
    line-height: 1.6;
    margin-bottom: 28px;
  }
  .one-liner .blade { color: var(--accent-violet); }

  .ctas { display: flex; gap: 14px; flex-wrap: wrap; }
  .cta {
    font-family: "Press Start 2P", monospace;
    font-size: 9px;
    letter-spacing: 0.08em;
    padding: 14px 16px;
    border: 2px solid var(--accent-gold);
    background: var(--accent-gold);
    color: var(--bg-base);
    box-shadow: 0 0 0 1px var(--accent-gold);
    cursor: pointer;
    border-radius: 2px;
    transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
  }
  .cta:hover { box-shadow: 0 0 16px var(--accent-gold), 0 0 0 1px var(--accent-gold); transform: translateY(-2px); }
  .cta.ghost {
    background: transparent;
    border-color: var(--accent-violet);
    color: var(--accent-violet);
    box-shadow: 0 0 0 1px var(--accent-violet);
  }
  .cta.ghost:hover { box-shadow: 0 0 16px var(--accent-violet), 0 0 0 1px var(--accent-violet); }

  /* Stat card */
  .stat-card {
    background: var(--bg-surface);
    border: 2px solid var(--accent-gold);
    box-shadow: 0 0 20px rgba(245,197,66,0.18), 0 0 0 1px var(--accent-gold);
    padding: 0;
    border-radius: 2px;
    animation: slideInRight 420ms ease-out both;
    animation-delay: 120ms;
  }
  @keyframes slideInRight {
    from { opacity: 0; transform: translateX(30px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  .stat-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border-pixel);
  }
  .stat-head .title {
    font-family: "Press Start 2P", monospace;
    font-size: 9px;
    color: var(--accent-gold);
    letter-spacing: 0.1em;
  }
  .stat-head .hp {
    display: flex; gap: 4px; align-items: center;
    font-family: "Press Start 2P", monospace;
    font-size: 8px;
    color: var(--text-muted);
  }
  .stat-head .hp .heart {
    width: 8px; height: 8px; background: var(--accent-red);
    box-shadow: 0 0 0 1px #00000022;
    clip-path: polygon(50% 100%, 0 35%, 25% 0, 50% 25%, 75% 0, 100% 35%);
  }

  .stat-rows {
    display: grid;
    grid-template-columns: 100px 1fr;
    gap: 10px 18px;
    padding: 18px 18px 14px;
  }
  .stat-rows .label {
    font-family: "Press Start 2P", monospace;
    font-size: 8px;
    color: var(--text-muted);
    letter-spacing: 0.06em;
    align-self: center;
  }
  .stat-rows .value {
    font-family: "JetBrains Mono", monospace;
    font-size: 13px;
    color: var(--text-primary);
    align-self: center;
  }
  .stat-rows .value .pulse-dot {
    display: inline-block; width: 8px; height: 8px;
    background: var(--accent-teal);
    box-shadow: 0 0 10px var(--accent-teal);
    margin-right: 8px;
    animation: pulse 1.4s ease-in-out infinite;
    vertical-align: 1px;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.55; transform: scale(0.85); }
  }

  .stat-xp {
    border-top: 1px solid var(--border-pixel);
    padding: 14px 18px 16px;
  }
  .stat-xp .row {
    display: flex; justify-content: space-between;
    font-family: "Press Start 2P", monospace;
    font-size: 8px;
    color: var(--text-muted);
    margin-bottom: 8px;
  }
  .stat-xp .row .val { color: var(--accent-gold); }
  .xp-bar {
    height: 10px;
    background: var(--bg-elevated);
    border: 1px solid var(--border-pixel);
    box-shadow: 0 0 0 1px var(--border-pixel);
    position: relative;
    overflow: hidden;
  }
  .xp-fill {
    height: 100%;
    width: 0;
    background:
      repeating-linear-gradient(
        90deg,
        var(--accent-gold) 0 6px,
        #d9ad34 6px 8px
      );
    box-shadow: 0 0 10px rgba(245,197,66,0.5);
    animation: fillXP 1400ms ease-out 400ms forwards;
  }
  @keyframes fillXP {
    from { width: 0; }
    to   { width: 64%; }
  }

  .socials {
    display: flex; gap: 10px;
    border-top: 1px solid var(--border-pixel);
    padding: 12px 14px;
  }
  .socials a {
    width: 32px; height: 32px;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--text-muted);
    border: 1px solid var(--border-pixel);
    box-shadow: 0 0 0 1px var(--border-pixel);
    text-decoration: none;
    transition: color 150ms ease, box-shadow 150ms ease, border-color 150ms ease;
  }
  .socials a:hover {
    color: var(--accent-violet);
    border-color: var(--accent-violet);
    box-shadow: 0 0 10px var(--accent-violet), 0 0 0 1px var(--accent-violet);
  }
  .socials a svg { width: 16px; height: 16px; }

  /* ---------- FEATURED QUESTS ---------- */
  .quests {
    padding: 48px clamp(20px, 5vw, 64px) 96px;
    position: relative;
    z-index: 1;
  }
  .quests-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 24px;
  }
  .quests-head .label {
    font-family: "Press Start 2P", monospace;
    font-size: 10px;
    color: var(--accent-gold);
    letter-spacing: 0.1em;
  }
  .quests-head .all {
    font-family: "Press Start 2P", monospace;
    font-size: 8px;
    color: var(--text-muted);
    text-decoration: none;
    border: 1px solid var(--border-pixel);
    box-shadow: 0 0 0 1px var(--border-pixel);
    padding: 8px 10px;
  }
  .quests-head .all:hover { color: var(--text-primary); border-color: var(--text-muted); }

  .quest-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
  }
  @media (max-width: 960px) { .quest-grid { grid-template-columns: 1fr; } }

  .quest-card {
    background: var(--bg-surface);
    border: 2px solid var(--accent-gold);
    box-shadow: 0 0 20px rgba(245,197,66,0.2), 0 0 0 1px var(--accent-gold);
    padding: 0;
    position: relative;
    border-radius: 2px;
    transition: transform 200ms ease, box-shadow 200ms ease;
    opacity: 0;
    transform: translateY(16px);
  }
  .quest-card.in {
    animation: fadeUp 480ms ease-out forwards;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .quest-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 0 28px rgba(245,197,66,0.45), 0 0 0 1px var(--accent-gold);
  }
  .quest-card .legendary {
    position: absolute;
    top: 10px; right: 10px;
    background: var(--accent-gold);
    color: var(--bg-base);
    font-family: "Press Start 2P", monospace;
    font-size: 7px;
    padding: 5px 6px;
    box-shadow: 0 0 0 1px var(--accent-gold);
    letter-spacing: 0.06em;
  }
  .quest-card .thumb {
    aspect-ratio: 16 / 9;
    background:
      repeating-linear-gradient(
        45deg,
        rgba(124,109,245,0.06) 0 8px,
        rgba(124,109,245,0.02) 8px 16px
      ),
      var(--bg-elevated);
    border-bottom: 1px solid var(--border-pixel);
    display: flex; align-items: center; justify-content: center;
    color: var(--text-muted);
    font-family: "Press Start 2P", monospace;
    font-size: 8px;
    letter-spacing: 0.1em;
    position: relative;
  }
  .quest-card .thumb .icon {
    width: 38px; height: 38px;
    background: var(--bg-surface);
    border: 2px solid var(--border-pixel);
    box-shadow: 0 0 0 1px var(--border-pixel);
    display: flex; align-items: center; justify-content: center;
    font-family: "Press Start 2P", monospace; font-size: 14px;
    color: var(--accent-gold);
    image-rendering: pixelated;
  }
  .quest-card .body { padding: 14px 14px 16px; }
  .quest-card .qname {
    font-family: "Press Start 2P", monospace;
    font-size: 10px;
    color: var(--text-primary);
    margin: 2px 0 8px;
    letter-spacing: 0.04em;
  }
  .quest-card .qdesc {
    font-family: "JetBrains Mono", monospace;
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.55;
    min-height: 38px;
  }
  .quest-card .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 14px; }
  .quest-card .tag {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    background: rgba(124,109,245,0.15);
    color: var(--accent-violet);
    border: 1px solid var(--accent-violet);
    box-shadow: 0 0 0 1px var(--accent-violet);
    padding: 2px 6px;
    border-radius: 2px;
  }
  .quest-card .qcta {
    width: 100%;
    font-family: "Press Start 2P", monospace;
    font-size: 9px;
    color: var(--accent-gold);
    background: transparent;
    border: 2px solid var(--accent-gold);
    box-shadow: 0 0 0 1px var(--accent-gold);
    padding: 10px 12px;
    cursor: pointer;
    letter-spacing: 0.08em;
    transition: background 160ms ease, color 160ms ease;
  }
  .quest-card .qcta:hover { background: var(--accent-gold); color: var(--bg-base); }

  .quest-card .stat-row {
    display: flex; justify-content: space-between;
    font-family: "Press Start 2P", monospace; font-size: 7px;
    color: var(--text-muted);
    margin-top: 2px;
  }
  .quest-card .stat-row .val.gold { color: var(--accent-gold); }
  .quest-card .stat-row .val.teal { color: var(--accent-teal); }
  .quest-card .stat-row .val.violet { color: var(--accent-violet); }

  /* HUD strip */
  .hud {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px clamp(20px, 5vw, 64px);
    border-top: 1px solid var(--border-pixel);
    border-bottom: 1px solid var(--border-pixel);
    background: rgba(18,21,43,0.5);
    font-family: "Press Start 2P", monospace;
    font-size: 8px;
    color: var(--text-muted);
    letter-spacing: 0.1em;
  }
  .hud .item { display: inline-flex; align-items: center; gap: 8px; }
  .hud .item.gold { color: var(--accent-gold); }
  .hud .item.teal { color: var(--accent-teal); }
  .hud .item.violet { color: var(--accent-violet); }
  .hud .item .dot {
    width: 6px; height: 6px; background: currentColor;
    box-shadow: 0 0 8px currentColor;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg-base); }
  ::-webkit-scrollbar-thumb { background: var(--border-pixel); border: 2px solid var(--bg-base); }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent-violet); }

  /* Selection */
  ::selection { background: var(--accent-violet); color: var(--bg-base); }

  /* Avatar slot */
  .avatar {
    --size: 220px;
    width: var(--size);
    height: var(--size);
    margin-bottom: 18px;
    border: 2px solid var(--accent-violet);
    box-shadow: 0 0 16px rgba(124,109,245,0.35), 0 0 0 1px var(--accent-violet);
    background:
      linear-gradient(135deg, rgba(124,109,245,0.08), rgba(61,214,172,0.04)),
      var(--bg-surface);
    image-rendering: pixelated;
    position: relative;
    border-radius: 2px;
    overflow: hidden;
    animation: avatarIdle 1.6s ease-in-out infinite;
  }
  @keyframes avatarIdle {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-2px); }
  }
  .avatar image-slot {
    width: 100%;
    height: 100%;
    display: block;
  }
  .avatar::after {
    /* corner tick marks */
    content: "";
    position: absolute;
    inset: 4px;
    border: 1px dashed rgba(124,109,245,0.25);
    pointer-events: none;
  }
  .avatar-row {
    display: flex;
    align-items: flex-end;
    gap: 14px;
    margin-bottom: 8px;
  }
  .avatar-row .meta {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding-bottom: 6px;
  }
  .avatar-row .meta .tag {
    font-family: "Press Start 2P", monospace;
    font-size: 7px;
    color: var(--text-muted);
    letter-spacing: 0.1em;
    border: 1px solid var(--border-pixel);
    box-shadow: 0 0 0 1px var(--border-pixel);
    padding: 5px 7px;
    width: max-content;
  }
  .avatar-row .meta .tag.online { color: var(--accent-teal); border-color: var(--accent-teal); box-shadow: 0 0 0 1px var(--accent-teal); }
  .avatar-row .meta .tag.online::before {
    content: "";
    display: inline-block;
    width: 6px; height: 6px;
    background: var(--accent-teal);
    box-shadow: 0 0 8px var(--accent-teal);
    margin-right: 6px;
    vertical-align: 1px;
    animation: pulse 1.4s ease-in-out infinite;
  }

  /* Tweaks: keep root sane */
  .app, .stars, .welcome { will-change: transform, opacity; }
</style>
</head>
<body>
  <div class="stars" aria-hidden="true"><div class="layer"></div></div>
  <div id="root"></div>

  <script src="image-slot.js"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" data-presets="env,react">
    const { useState, useEffect, useRef, useMemo } = React;

    // --- Dialogue text (typewriter source) ---
    const DIALOGUE_LINES = [
      "Hey. I'm Raaj.",
      "Builder. Breaker. Repeat.",
      "",
      "I build things for the web — and occasionally",
      "break them in interesting ways."
    ];
    const FULL_TEXT = DIALOGUE_LINES.join("\n");

    function Typewriter({ text, speed = 28, onDone }) {
      const [i, setI] = useState(0);
      useEffect(() => {
        if (i >= text.length) { onDone && onDone(); return; }
        const t = setTimeout(() => setI(i + 1), speed);
        return () => clearTimeout(t);
      }, [i, text, speed]);
      const shown = text.slice(0, i);
      const done = i >= text.length;
      return (
        <span className="line">
          {shown}
          {!done && <span className="cursor" />}
        </span>
      );
    }

    // --- SVG socials ---
    const Icon = {
      github: (
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 .5C5.7.5.6 5.6.6 11.9c0 5 3.3 9.3 7.8 10.8.6.1.8-.2.8-.6v-2.2c-3.2.7-3.9-1.4-3.9-1.4-.5-1.3-1.3-1.7-1.3-1.7-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.7 1.3 3.4 1 .1-.8.4-1.3.8-1.6-2.6-.3-5.3-1.3-5.3-5.8 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.2 1.2.9-.3 1.9-.4 2.9-.4s2 .1 2.9.4c2.2-1.5 3.2-1.2 3.2-1.2.6 1.6.2 2.8.1 3.1.7.8 1.2 1.9 1.2 3.1 0 4.5-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.2c0 .3.2.7.8.6 4.5-1.5 7.8-5.8 7.8-10.8C23.4 5.6 18.3.5 12 .5z"/>
        </svg>
      ),
      linkedin: (
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M4.98 3.5C4.98 4.88 3.87 6 2.5 6S0 4.88 0 3.5 1.12 1 2.5 1s2.48 1.12 2.48 2.5zM.22 8h4.56v14H.22V8zm7.4 0h4.37v1.92h.07c.61-1.15 2.1-2.36 4.32-2.36 4.62 0 5.47 3.04 5.47 7v7.44h-4.56v-6.6c0-1.57-.03-3.59-2.19-3.59-2.2 0-2.53 1.72-2.53 3.49V22H7.62V8z"/>
        </svg>
      ),
      twitter: (
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M18.244 2H21.5l-7.5 8.57L23 22h-6.844l-5.36-7.012L4.6 22H1.34l8.02-9.165L1 2h7.02l4.85 6.41L18.244 2zm-1.2 18h1.9L7.06 4H5.06l11.984 16z"/>
        </svg>
      ),
    };

    // ---------- WELCOME OVERLAY ----------
    function Welcome({ onEnter }) {
      const [done, setDone] = useState(false);
      const [hide, setHide] = useState(false);

      // allow Enter / Space to advance
      useEffect(() => {
        const k = (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            handleEnter();
          }
        };
        window.addEventListener("keydown", k);
        return () => window.removeEventListener("keydown", k);
      });

      function handleEnter() {
        if (hide) return;
        setHide(true);
        setTimeout(() => onEnter && onEnter(), 480);
      }

      return (
        <div className={"welcome " + (hide ? "hide" : "")}>
          <div className="top-strip"><span className="dot"></span>SAVE FILE 01 · NEW GAME</div>
          <button className="skip" onClick={handleEnter}>[ ESC ] SKIP INTRO</button>

          <div className="welcome-inner">
            <div className="sprite-box" aria-label="Character sprite placeholder">
              <span className="sprite-label">[ CHARACTER<br/>SPRITE ]</span>
            </div>

            <div className="dialogue" role="dialog" aria-label="Intro dialogue">
              <div className="dialogue-head">
                <span className="name">▸ RAAJ PATRE</span>
                <span className="lvl">[LVL 2]</span>
              </div>
              <div className="dialogue-body">
                <Typewriter text={FULL_TEXT} speed={26} onDone={() => setDone(true)} />
                {done && <span className="next">[▼]</span>}
              </div>
            </div>

            <button className="btn" onClick={handleEnter} disabled={!done}>
              ▶  ENTER PORTFOLIO
            </button>
          </div>
        </div>
      );
    }

    // ---------- HERO ----------
    function StatCard() {
      return (
        <div className="stat-card">
          <div className="stat-head">
            <span className="title">★ PLAYER STATS</span>
            <span className="hp">
              HP&nbsp;
              <span className="heart"></span>
              <span className="heart"></span>
              <span className="heart"></span>
              <span className="heart" style={{opacity:0.35}}></span>
            </span>
          </div>

          <div className="stat-rows">
            <span className="label">CLASS</span>
            <span className="value">Full-stack Dev</span>

            <span className="label">GUILD</span>
            <span className="value">Newton School of Tech</span>

            <span className="label">FACTION</span>
            <span className="value">GSSoC · GenAI Academy</span>

            <span className="label">STATUS</span>
            <span className="value"><span className="pulse-dot"></span>Available for quests</span>

            <span className="label">LEVEL</span>
            <span className="value" style={{color: "var(--accent-gold)"}}>02</span>
          </div>

          <div className="stat-xp">
            <div className="row">
              <span>XP TO LVL 03</span>
              <span className="val">640 / 1000</span>
            </div>
            <div className="xp-bar"><div className="xp-fill"></div></div>
          </div>

          <div className="socials">
            <a href="#" aria-label="GitHub" title="GitHub">{Icon.github}</a>
            <a href="#" aria-label="LinkedIn" title="LinkedIn">{Icon.linkedin}</a>
            <a href="#" aria-label="Twitter" title="Twitter">{Icon.twitter}</a>
            <span style={{flex:1}}></span>
            <a href="#" style={{width:"auto", padding:"0 10px", fontFamily:'"Press Start 2P", monospace', fontSize: 8, letterSpacing: "0.08em"}}>raaj@inbox.dev</a>
          </div>
        </div>
      );
    }

    function Hero() {
      return (
        <section className="hero">
          <div className="left">
            <div className="avatar-row">
              <div className="avatar" title="Drop your profile picture here">
                <image-slot
                  id="raaj-avatar"
                  shape="rect"
                  radius="0"
                  placeholder="[ PFP ]"
                ></image-slot>
              </div>
              <div className="meta">
                <span className="tag">CHARACTER · MAGE/DEV</span>
                <span className="tag online">ONLINE</span>
              </div>
            </div>
            <span className="eyebrow">PLAYER ONE</span>
            <h1 className="name">RAAJ PATRE</h1>
            <div className="role">FULL-STACK DEVELOPER <span className="sep">·</span> LVL 2</div>
            <p className="one-liner">
              <span className="blade">»</span> Building web apps and breaking them in equal measure.
            </p>
            <div className="ctas">
              <button className="cta">[ VIEW QUESTS ]</button>
              <button className="cta ghost">[ DOWNLOAD RESUME ]</button>
            </div>
          </div>
          <div className="right">
            <StatCard />
          </div>
        </section>
      );
    }

    // ---------- HUD ----------
    function HUD() {
      return (
        <div className="hud">
          <span className="item gold"><span className="dot"></span>★ 12 QUESTS COMPLETED</span>
          <span className="item teal"><span className="dot"></span>◆ 7 SHIPPED · 3 IN PROGRESS</span>
          <span className="item violet"><span className="dot"></span>⚡ 4 LANGUAGES UNLOCKED</span>
          <span className="item"><span className="dot" style={{background: "var(--text-muted)"}}></span>SAVE: AUTO · 02:14</span>
        </div>
      );
    }

    // ---------- FEATURED QUESTS ----------
    const QUESTS = [
      {
        name: "DUNGEON DASH",
        desc: "Real-time multiplayer maze game. Sockets, sweat, and surprisingly aggressive ghosts.",
        tags: ["React", "Node", "Socket.IO", "Redis"],
        icon: "▣",
        stats: { kills: "1.2k stars", boss: "Shipped", loot: "MIT" }
      },
      {
        name: "PROMPT FORGE",
        desc: "A studio for prompt engineers — versioning, A/B duels, and cost telemetry per token.",
        tags: ["Next.js", "Postgres", "OpenAI", "tRPC"],
        icon: "✦",
        stats: { kills: "340 users", boss: "Shipped", loot: "Beta" }
      },
      {
        name: "LO-FI CLI",
        desc: "Terminal music player with chiptune visualizer and key-mashy keybinds. Built for late nights.",
        tags: ["Rust", "TUI", "Audio"],
        icon: "♪",
        stats: { kills: "5.4k DL", boss: "Shipped", loot: "Open" }
      }
    ];

    function QuestCard({ q, index }) {
      const ref = useRef(null);
      const [seen, setSeen] = useState(false);

      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        const io = new IntersectionObserver((entries) => {
          entries.forEach((e) => {
            if (e.isIntersecting) { setSeen(true); io.disconnect(); }
          });
        }, { threshold: 0.15 });
        io.observe(el);
        return () => io.disconnect();
      }, []);

      return (
        <article
          ref={ref}
          className={"quest-card " + (seen ? "in" : "")}
          style={{ animationDelay: (index * 80) + "ms" }}
        >
          <span className="legendary">★ LEGENDARY</span>
          <div className="thumb">
            <div className="icon">{q.icon}</div>
          </div>
          <div className="body">
            <div className="qname">{q.name}</div>
            <p className="qdesc">{q.desc}</p>
            <div className="tags">
              {q.tags.map(t => <span key={t} className="tag">{t}</span>)}
            </div>
            <div className="stat-row"><span>DROPS</span><span className="val gold">{q.stats.kills}</span></div>
            <div className="stat-row"><span>BOSS</span><span className="val teal">{q.stats.boss}</span></div>
            <div className="stat-row" style={{marginBottom: 14}}><span>LOOT</span><span className="val violet">{q.stats.loot}</span></div>
            <button className="qcta">[ VIEW QUEST ▸ ]</button>
          </div>
        </article>
      );
    }

    function Quests() {
      return (
        <section className="quests">
          <div className="quests-head">
            <span className="label">★ FEATURED QUESTS</span>
            <a className="all" href="#">[ ALL QUESTS ▸ ]</a>
          </div>
          <div className="quest-grid">
            {QUESTS.map((q, i) => <QuestCard key={q.name} q={q} index={i} />)}
          </div>
        </section>
      );
    }

    // ---------- APP ----------
    function App() {
      const [entered, setEntered] = useState(false);

      // ESC to skip
      useEffect(() => {
        const k = (e) => { if (e.key === "Escape" && !entered) setEntered(true); };
        window.addEventListener("keydown", k);
        return () => window.removeEventListener("keydown", k);
      }, [entered]);

      // Toggle body class so the starfield can fade out under the gif background
      useEffect(() => {
        if (entered) document.body.classList.add("entered");
        else document.body.classList.remove("entered");
      }, [entered]);

      return (
        <>
          {!entered && <Welcome onEnter={() => setEntered(true)} />}
          <div className="home-bg" aria-hidden="true" style={{ opacity: entered ? 1 : 0 }}></div>
          <div className={"app " + (entered ? "show" : "")} aria-hidden={!entered}>
            <header className="nav">
              <div className="brand">
                <span className="chip">RP</span> RAAJ.DEV
              </div>
              <nav className="links">
                <a className="active" href="Home.html">HOME</a>
                <a href="Quest Board.html">QUESTS</a>
                <a href="Character Sheet.html">ABOUT</a>
                <a href="Achievement Cabinet.html">CERTS</a>
                <a href="Battle Log.html">LOG</a>
                <a href="Contact.html">CONTACT</a>
              </nav>
              <span className="save">◆ SAVED · 02:14</span>
            </header>

            <Hero />
            <HUD />
            <Quests />
          </div>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
