<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Send a Raven — Raaj Patre</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Press+Start+2P&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg-base:        #0a0c1a;
    --bg-surface:     #12152b;
    --bg-elevated:    #1a1e38;
    --text-primary:   #e8e8f0;
    --text-muted:     #6b7094;
    --accent-gold:    #f5c542;
    --accent-violet:  #7c6df5;
    --accent-teal:    #3dd6ac;
    --accent-red:     #f55c5c;
    --border-pixel:   #2a2d4a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg-base);
    color: var(--text-primary);
    font-family: "JetBrains Mono", monospace;
    font-size: 14px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    image-rendering: pixelated;
    min-height: 100vh;
    overflow-x: hidden;
  }
  input, select, textarea, button { font-family: inherit; }
  ::selection { background: var(--accent-violet); color: var(--bg-base); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg-base); }
  ::-webkit-scrollbar-thumb { background: var(--border-pixel); border: 2px solid var(--bg-base); }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent-violet); }

  /* ---------- STAR FIELD ---------- */
  .stars {
    position: fixed; inset: 0;
    overflow: hidden; pointer-events: none; z-index: 0;
    background:
      radial-gradient(ellipse at 80% 0%, rgba(124,109,245,0.06), transparent 55%),
      radial-gradient(ellipse at 0% 100%, rgba(245,197,66,0.04), transparent 55%),
      var(--bg-base);
  }
  .stars::before, .stars::after {
    content: ""; position: absolute; top: -50%; left: 0;
    width: 100%; height: 200%; background-repeat: repeat;
  }
  .stars::before {
    background-image:
      radial-gradient(1px 1px at 23px 47px, rgba(232,232,240,0.55), transparent 60%),
      radial-gradient(1px 1px at 167px 211px, rgba(232,232,240,0.5), transparent 60%),
      radial-gradient(1.5px 1.5px at 312px 256px, rgba(232,232,240,0.45), transparent 60%),
      radial-gradient(2px 2px at 401px 174px, rgba(245,197,66,0.55), transparent 60%);
    background-size: 480px 480px;
    animation: drift 120s linear infinite;
    opacity: 0.8;
  }
  .stars::after {
    background-image:
      radial-gradient(1.5px 1.5px at 55px 90px, rgba(124,109,245,0.55), transparent 60%),
      radial-gradient(1.5px 1.5px at 380px 220px, rgba(61,214,172,0.45), transparent 60%);
    background-size: 540px 540px;
    animation: drift 80s linear infinite reverse;
    opacity: 0.7;
  }
  @keyframes drift {
    from { transform: translate3d(0,0,0); }
    to   { transform: translate3d(-40px, 80px, 0); }
  }

  /* ---------- NAV ---------- */
  .nav {
    position: sticky; top: 0; z-index: 30;
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px clamp(20px, 5vw, 64px);
    border-bottom: 1px solid var(--border-pixel);
    background: rgba(10,12,26,0.78);
    backdrop-filter: blur(6px);
  }
  .nav .brand {
    font-family: "Press Start 2P", monospace;
    font-size: 11px; color: var(--text-primary);
    display: flex; align-items: center; gap: 10px;
    text-decoration: none;
  }
  .nav .brand .chip {
    background: var(--accent-violet);
    color: var(--bg-base);
    padding: 4px 6px; font-size: 8px;
    box-shadow: 0 0 0 1px var(--accent-violet);
  }
  .nav .links { display: flex; gap: 22px; }
  .nav .links a {
    font-family: "Press Start 2P", monospace;
    font-size: 9px; color: var(--text-muted);
    text-decoration: none; letter-spacing: 0.05em;
  }
  .nav .links a:hover { color: var(--text-primary); }
  .nav .links a.active { color: var(--accent-gold); }
  .nav .save {
    font-family: "Press Start 2P", monospace;
    font-size: 8px; color: var(--accent-teal);
    border: 1px solid var(--border-pixel);
    box-shadow: 0 0 0 1px var(--border-pixel);
    padding: 6px 8px;
  }

  /* ---------- HEADER ---------- */
  .page-head {
    position: relative; z-index: 1;
    padding: 56px clamp(20px, 5vw, 64px) 28px;
    text-align: center;
    border-bottom: 1px solid var(--border-pixel);
  }
  .page-head .eyebrow {
    font-family: "Press Start 2P", monospace;
    font-size: 8px;
    color: var(--accent-violet);
    letter-spacing: 0.3em;
    margin-bottom: 16px;
  }
  .page-head h1 {
    font-family: "Press Start 2P", monospace;
    font-size: clamp(22px, 4.5vw, 32px);
    color: var(--accent-gold);
    margin: 0 0 14px;
    letter-spacing: 0.06em;
    text-shadow: 0 0 22px rgba(245,197,66,0.35);
    display: inline-flex; align-items: center; gap: 18px;
  }
  .page-head h1 .raven {
    width: 36px; height: 36px;
    flex-shrink: 0;
    image-rendering: pixelated;
  }
  .page-head .sub {
    font-family: "JetBrains Mono", monospace;
    font-size: 14px;
    color: var(--text-muted);
    max-width: 540px;
    margin: 0 auto;
    line-height: 1.7;
  }

  /* ---------- LAYOUT ---------- */
  .layout {
    position: relative; z-index: 1;
    display: grid;
    grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
    gap: 24px;
    max-width: 1100px;
    margin: 0 auto;
    padding: 36px clamp(20px, 5vw, 64px) 80px;
  }
  @media (max-width: 880px) {
    .layout { grid-template-columns: 1fr; }
  }

  /* ---------- CHANNELS CARD ---------- */
  .channels {
    background: var(--bg-surface);
    border: 2px solid var(--accent-violet);
    box-shadow: 0 0 18px rgba(124,109,245,0.25), 0 0 0 1px var(--accent-violet);
    border-radius: 2px;
    height: fit-content;
  }
  .channels-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border-pixel);
  }
  .channels-head .title {
    font-family: "Press Start 2P", monospace;
    font-size: 9px;
    color: var(--accent-violet);
    letter-spacing: 0.12em;
  }
  .channels-head .online {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: "Press Start 2P", monospace;
    font-size: 7px;
    color: var(--accent-teal);
    letter-spacing: 0.1em;
  }
  .channels-head .online .dot {
    width: 7px; height: 7px;
    background: var(--accent-teal);
    box-shadow: 0 0 8px var(--accent-teal);
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:0.55;transform:scale(0.85);} }

  .channel {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border-pixel);
    text-decoration: none;
    color: var(--text-primary);
    transition: background 150ms ease, border-color 150ms ease;
    position: relative;
  }
  .channel:last-of-type { border-bottom: 0; }
  .channel:hover { background: var(--bg-elevated); }
  .channel .icon {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg-elevated);
    border: 1px solid var(--border-pixel);
    box-shadow: 0 0 0 1px var(--border-pixel);
    border-radius: 2px;
    color: var(--text-muted);
    transition: color 150ms ease, border-color 150ms ease, box-shadow 150ms ease;
    flex-shrink: 0;
  }
  .channel:hover .icon { color: var(--c); border-color: var(--c); box-shadow: 0 0 8px var(--c), 0 0 0 1px var(--c); }
  .channel .icon svg { width: 18px; height: 18px; }
  .channel .label {
    font-family: "Press Start 2P", monospace;
    font-size: 7px;
    color: var(--text-muted);
    letter-spacing: 0.12em;
    margin-bottom: 4px;
  }
  .channel .val {
    font-family: "JetBrains Mono", monospace;
    font-size: 13px;
    color: var(--text-primary);
    word-break: break-word;
  }
  .channel.gold   { --c: var(--accent-gold); }
  .channel.violet { --c: var(--accent-violet); }
  .channel.teal   { --c: var(--accent-teal); }
  .channel.red    { --c: var(--accent-red); }
  .channel .copy {
    position: absolute;
    right: 12px; top: 50%; transform: translateY(-50%);
    background: transparent;
    border: 1px solid var(--border-pixel);
    box-shadow: 0 0 0 1px var(--border-pixel);
    color: var(--text-muted);
    font-family: "Press Start 2P", monospace;
    font-size: 7px;
    padding: 6px 8px;
    cursor: pointer;
    border-radius: 2px;
    letter-spacing: 0.08em;
    opacity: 0;
    transition: opacity 150ms ease, color 150ms ease, border-color 150ms ease;
  }
  .channel:hover .copy { opacity: 1; }
  .channel .copy:hover { color: var(--accent-teal); border-color: var(--accent-teal); box-shadow: 0 0 0 1px var(--accent-teal); }
  .channel .copy.copied { color: var(--accent-teal); border-color: var(--accent-teal); box-shadow: 0 0 0 1px var(--accent-teal); opacity: 1; }

  .channels-foot {
    padding: 14px 16px;
    border-top: 1px solid var(--border-pixel);
    background: rgba(10,12,26,0.4);
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  }
  .meta {
    display: flex; flex-direction: column; gap: 4px;
  }
  .meta .k {
    font-family: "Press Start 2P", monospace;
    font-size: 7px;
    color: var(--text-muted);
    letter-spacing: 0.1em;
  }
  .meta .v {
    font-family: "JetBrains Mono", monospace;
    font-size: 12px;
    color: var(--text-primary);
  }
  .meta .v.teal { color: var(--accent-teal); }
  .meta .v.gold { color: var(--accent-gold); }

  /* ---------- FORM (DIALOGUE BOX) ---------- */
  .form-box {
    background: var(--bg-surface);
    border: 2px solid var(--accent-gold);
    box-shadow: 0 0 20px rgba(245,197,66,0.18), 0 0 0 1px var(--accent-gold);
    border-radius: 2px;
    display: flex; flex-direction: column;
  }
  .form-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border-pixel);
  }
  .form-head .who {
    font-family: "Press Start 2P", monospace;
    font-size: 10px;
    color: var(--accent-gold);
    letter-spacing: 0.06em;
  }
  .form-head .lvl {
    font-family: "Press Start 2P", monospace;
    font-size: 9px;
    color: var(--accent-teal);
    letter-spacing: 0.06em;
  }
  .form-body { padding: 22px 22px 18px; }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 540px) { .row { grid-template-columns: 1fr; } }

  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-family: "Press Start 2P", monospace;
    font-size: 8px;
    color: var(--text-muted);
    letter-spacing: 0.12em;
    margin-bottom: 8px;
  }
  .field label .req { color: var(--accent-red); margin-left: 4px; }
  .input, .textarea, .select {
    width: 100%;
    background: var(--bg-base);
    color: var(--text-primary);
    border: 2px solid var(--border-pixel);
    box-shadow: 0 0 0 1px var(--border-pixel);
    padding: 11px 12px;
    font-size: 13px;
    font-family: "JetBrains Mono", monospace;
    border-radius: 2px;
    outline: none;
    transition: border-color 150ms ease, box-shadow 150ms ease;
  }
  .input:focus, .textarea:focus, .select:focus {
    border-color: var(--accent-violet);
    box-shadow: 0 0 12px rgba(124,109,245,0.4), 0 0 0 1px var(--accent-violet);
  }
  .field.error .input,
  .field.error .textarea {
    border-color: var(--accent-red);
    box-shadow: 0 0 0 1px var(--accent-red);
  }
  .field .err {
    font-size: 11px;
    color: var(--accent-red);
    margin-top: 6px;
  }
  .input::placeholder, .textarea::placeholder { color: var(--text-muted); }

  .textarea { min-height: 140px; resize: vertical; line-height: 1.7; }

  /* topic radio chips */
  .topics { display: flex; flex-wrap: wrap; gap: 6px; }
  .topic-chip {
    font-family: "JetBrains Mono", monospace;
    font-size: 12px;
    color: var(--text-muted);
    background: transparent;
    border: 1px solid var(--border-pixel);
    box-shadow: 0 0 0 1px var(--border-pixel);
    padding: 7px 10px;
    border-radius: 2px;
    cursor: pointer;
    transition: color 150ms ease, border-color 150ms ease, background 150ms ease, box-shadow 150ms ease;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .topic-chip:hover {
    color: var(--accent-violet);
    border-color: var(--accent-violet);
    box-shadow: 0 0 0 1px var(--accent-violet);
  }
  .topic-chip.active {
    background: var(--accent-violet);
    color: var(--bg-base);
    border-color: var(--accent-violet);
    box-shadow: 0 0 10px rgba(124,109,245,0.55), 0 0 0 1px var(--accent-violet);
  }
  .topic-chip .glyph { font-size: 11px; }

  /* char counter */
  .counter {
    font-family: "Press Start 2P", monospace;
    font-size: 7px;
    color: var(--text-muted);
    letter-spacing: 0.08em;
    text-align: right;
    margin-top: 6px;
  }
  .counter.warn { color: var(--accent-red); }

  .form-foot {
    padding: 14px 22px 18px;
    border-top: 1px solid var(--border-pixel);
    display: flex; justify-content: space-between; align-items: center;
    gap: 14px; flex-wrap: wrap;
  }
  .form-foot .note {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    color: var(--text-muted);
    line-height: 1.5;
  }

  .send-btn {
    font-family: "Press Start 2P", monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    color: var(--bg-base);
    background: var(--accent-gold);
    border: 2px solid var(--accent-gold);
    box-shadow: 0 0 0 1px var(--accent-gold);
    padding: 14px 18px;
    cursor: pointer;
    border-radius: 2px;
    transition: transform 150ms ease, box-shadow 150ms ease, filter 150ms ease, background 100ms;
    display: inline-flex; align-items: center; gap: 10px;
  }
  .send-btn:hover {
    transform: scale(1.03);
    box-shadow: 0 0 18px var(--accent-gold), 0 0 0 1px var(--accent-gold);
    filter: brightness(1.08);
  }
  .send-btn:active { transform: scale(0.98); }
  .send-btn[disabled] { opacity: 0.55; cursor: not-allowed; }
  .send-btn.sending { background: var(--accent-violet); border-color: var(--accent-violet); box-shadow: 0 0 0 1px var(--accent-violet); color: #fff; }
  .send-btn .spin {
    width: 12px; height: 12px;
    border: 2px solid rgba(255,255,255,0.35);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- SUCCESS ---------- */
  .success {
    background: var(--bg-surface);
    border: 2px solid var(--accent-teal);
    box-shadow: 0 0 22px rgba(61,214,172,0.3), 0 0 0 1px var(--accent-teal);
    padding: 22px 22px 18px;
    border-radius: 2px;
    animation: slideUp 280ms ease-out;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .success .head {
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid var(--border-pixel);
    padding-bottom: 12px; margin-bottom: 14px;
  }
  .success .head .who {
    font-family: "Press Start 2P", monospace;
    font-size: 10px;
    color: var(--accent-teal);
    letter-spacing: 0.06em;
  }
  .success .head .lvl {
    font-family: "Press Start 2P", monospace;
    font-size: 9px;
    color: var(--accent-gold);
  }
  .success p {
    font-family: "JetBrains Mono", monospace;
    font-size: 14px;
    color: var(--text-primary);
    line-height: 1.8;
    margin: 0 0 14px;
  }
  .success .quest-row {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    margin: 14px 0 18px;
    padding: 12px;
    background: rgba(10,12,26,0.5);
    border: 1px solid var(--border-pixel);
    box-shadow: 0 0 0 1px var(--border-pixel);
  }
  .success .row-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .reset-btn {
    font-family: "Press Start 2P", monospace;
    font-size: 9px;
    color: var(--accent-violet);
    background: transparent;
    border: 2px solid var(--accent-violet);
    box-shadow: 0 0 0 1px var(--accent-violet);
    padding: 12px 14px;
    cursor: pointer;
    border-radius: 2px;
    letter-spacing: 0.08em;
    transition: background 150ms ease, color 150ms ease;
  }
  .reset-btn:hover { background: var(--accent-violet); color: var(--bg-base); }
  .home-btn {
    font-family: "Press Start 2P", monospace;
    font-size: 9px;
    color: var(--bg-base);
    background: var(--accent-gold);
    border: 2px solid var(--accent-gold);
    box-shadow: 0 0 0 1px var(--accent-gold);
    padding: 12px 14px;
    cursor: pointer;
    border-radius: 2px;
    letter-spacing: 0.08em;
    text-decoration: none;
    transition: transform 150ms ease, box-shadow 150ms ease, filter 150ms ease;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .home-btn:hover { transform: scale(1.03); box-shadow: 0 0 14px var(--accent-gold), 0 0 0 1px var(--accent-gold); }

  /* ---------- FOOTER ---------- */
  .foot {
    position: relative; z-index: 1;
    border-top: 1px solid var(--border-pixel);
    padding: 18px clamp(20px, 5vw, 64px);
    display: flex; justify-content: space-between; align-items: center;
    background: var(--bg-surface);
    flex-wrap: wrap; gap: 10px;
  }
  .foot .l, .foot .r {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px; color: var(--text-muted);
  }
  .foot .c {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px; color: var(--text-muted); letter-spacing: 0.06em;
  }
  .foot .heart { color: var(--accent-red); }
  @media (max-width: 720px) { .foot .c { display: none; } }
</style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" data-presets="env,react">
    const { useState, useMemo, useEffect } = React;

    // ---------- ICONS ----------
    const Raven = () => (
      <svg className="raven" viewBox="0 0 16 16" shapeRendering="crispEdges" aria-hidden="true">
        {/* body */}
        <rect x="6" y="4" width="4" height="1" fill="#e8e8f0" />
        <rect x="5" y="5" width="6" height="1" fill="#e8e8f0" />
        <rect x="4" y="6" width="8" height="2" fill="#e8e8f0" />
        <rect x="4" y="8" width="7" height="2" fill="#e8e8f0" />
        <rect x="5" y="10" width="6" height="1" fill="#e8e8f0" />
        {/* head crest */}
        <rect x="9" y="2" width="2" height="2" fill="#e8e8f0" />
        {/* eye */}
        <rect x="9" y="5" width="1" height="1" fill="#f5c542" />
        {/* beak */}
        <rect x="11" y="5" width="2" height="1" fill="#f5c542" />
        <rect x="12" y="6" width="1" height="1" fill="#f5c542" />
        {/* wing dark */}
        <rect x="5" y="7" width="5" height="1" fill="#6b7094" />
        <rect x="6" y="8" width="4" height="1" fill="#6b7094" />
        {/* feet */}
        <rect x="6" y="11" width="1" height="1" fill="#f5c542" />
        <rect x="9" y="11" width="1" height="1" fill="#f5c542" />
        {/* trail (mail scroll) */}
        <rect x="1" y="9" width="3" height="1" fill="#f5c542" />
        <rect x="1" y="10" width="3" height="1" fill="#d9ad34" />
      </svg>
    );

    const Icon = {
      mail: (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <rect x="3" y="5" width="18" height="14" rx="1"/>
          <path d="M3 6l9 7 9-7"/>
        </svg>
      ),
      github: (
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 .5C5.7.5.6 5.6.6 11.9c0 5 3.3 9.3 7.8 10.8.6.1.8-.2.8-.6v-2.2c-3.2.7-3.9-1.4-3.9-1.4-.5-1.3-1.3-1.7-1.3-1.7-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.7 1.3 3.4 1 .1-.8.4-1.3.8-1.6-2.6-.3-5.3-1.3-5.3-5.8 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.2 1.2.9-.3 1.9-.4 2.9-.4s2 .1 2.9.4c2.2-1.5 3.2-1.2 3.2-1.2.6 1.6.2 2.8.1 3.1.7.8 1.2 1.9 1.2 3.1 0 4.5-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.2c0 .3.2.7.8.6 4.5-1.5 7.8-5.8 7.8-10.8C23.4 5.6 18.3.5 12 .5z"/>
        </svg>
      ),
      linkedin: (
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M4.98 3.5C4.98 4.88 3.87 6 2.5 6S0 4.88 0 3.5 1.12 1 2.5 1s2.48 1.12 2.48 2.5zM.22 8h4.56v14H.22V8zm7.4 0h4.37v1.92h.07c.61-1.15 2.1-2.36 4.32-2.36 4.62 0 5.47 3.04 5.47 7v7.44h-4.56v-6.6c0-1.57-.03-3.59-2.19-3.59-2.2 0-2.53 1.72-2.53 3.49V22H7.62V8z"/>
        </svg>
      ),
      twitter: (
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M18.244 2H21.5l-7.5 8.57L23 22h-6.844l-5.36-7.012L4.6 22H1.34l8.02-9.165L1 2h7.02l4.85 6.41L18.244 2zm-1.2 18h1.9L7.06 4H5.06l11.984 16z"/>
        </svg>
      ),
      pin: (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <path d="M12 21s-7-7-7-12a7 7 0 1 1 14 0c0 5-7 12-7 12z"/>
          <circle cx="12" cy="9" r="2.5"/>
        </svg>
      ),
    };

    // ---------- CHANNELS ----------
    const CHANNELS = [
      { key: "email",    label: "EMAIL",    val: "raaj@inbox.dev",            href: "mailto:raaj@inbox.dev", icon: Icon.mail,     cls: "gold",   copy: true },
      { key: "github",   label: "GITHUB",   val: "github.com/raajpatre",      href: "https://github.com/",  icon: Icon.github,   cls: "violet" },
      { key: "linkedin", label: "LINKEDIN", val: "linkedin.com/in/raajpatre", href: "https://linkedin.com/",icon: Icon.linkedin, cls: "teal" },
      { key: "twitter",  label: "TWITTER",  val: "@raajpatre",                href: "https://twitter.com/", icon: Icon.twitter,  cls: "red" },
      { key: "location", label: "LOCATION", val: "Bengaluru, IN",             href: null,                   icon: Icon.pin,      cls: "violet" },
    ];

    // ---------- TOPICS ----------
    const TOPICS = [
      { id: "quest",   label: "QUEST OPPORTUNITY", glyph: "★" },
      { id: "collab",  label: "COLLAB",            glyph: "◆" },
      { id: "hi",      label: "JUST SAYING HI",    glyph: "♪" },
      { id: "other",   label: "OTHER",             glyph: "▸" },
    ];

    // ---------- FORM ----------
    const MAX_MSG = 800;

    function ContactForm({ onSent }) {
      const [name, setName] = useState("");
      const [email, setEmail] = useState("");
      const [topic, setTopic] = useState("quest");
      const [msg, setMsg] = useState("");
      const [errs, setErrs] = useState({});
      const [sending, setSending] = useState(false);

      const validate = () => {
        const e = {};
        if (!name.trim()) e.name = "Name required.";
        if (!email.trim()) e.email = "Email required.";
        else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) e.email = "That doesn't look like an email.";
        if (!msg.trim()) e.msg = "Add a message — even one line.";
        else if (msg.length > MAX_MSG) e.msg = `Keep it under ${MAX_MSG} characters.`;
        setErrs(e);
        return Object.keys(e).length === 0;
      };

      const onSubmit = (ev) => {
        ev.preventDefault();
        if (!validate()) return;
        setSending(true);
        setTimeout(() => {
          setSending(false);
          onSent({
            name, email, topic, msg,
            id: "RVN-" + Math.random().toString(36).slice(2, 8).toUpperCase(),
            at: new Date(),
          });
        }, 900);
      };

      const counterCls = msg.length > MAX_MSG * 0.9 ? "counter warn" : "counter";

      return (
        <form className="form-box" onSubmit={onSubmit} noValidate>
          <div className="form-head">
            <span className="who">✉ COMPOSE A RAVEN</span>
            <span className="lvl">[ENC: AES-256]</span>
          </div>
          <div className="form-body">
            <div className="row">
              <div className={"field " + (errs.name ? "error" : "")}>
                <label htmlFor="name">NAME<span className="req">*</span></label>
                <input
                  id="name"
                  className="input"
                  value={name}
                  onChange={(e) => { setName(e.target.value); setErrs(x => ({...x, name: undefined})); }}
                  placeholder="Adventurer's name"
                  autoComplete="name"
                />
                {errs.name && <div className="err">{errs.name}</div>}
              </div>
              <div className={"field " + (errs.email ? "error" : "")}>
                <label htmlFor="email">EMAIL<span className="req">*</span></label>
                <input
                  id="email"
                  className="input"
                  type="email"
                  value={email}
                  onChange={(e) => { setEmail(e.target.value); setErrs(x => ({...x, email: undefined})); }}
                  placeholder="you@realm.com"
                  autoComplete="email"
                />
                {errs.email && <div className="err">{errs.email}</div>}
              </div>
            </div>

            <div className="field">
              <label>TOPIC</label>
              <div className="topics">
                {TOPICS.map(t => (
                  <button
                    key={t.id} type="button"
                    className={"topic-chip " + (topic === t.id ? "active" : "")}
                    onClick={() => setTopic(t.id)}
                  >
                    <span className="glyph">{t.glyph}</span>{t.label}
                  </button>
                ))}
              </div>
            </div>

            <div className={"field " + (errs.msg ? "error" : "")}>
              <label htmlFor="msg">MESSAGE<span className="req">*</span></label>
              <textarea
                id="msg"
                className="textarea"
                value={msg}
                onChange={(e) => { setMsg(e.target.value); setErrs(x => ({...x, msg: undefined})); }}
                placeholder="Tell me what you're working on, what you'd like to build, or just say hi…"
                maxLength={MAX_MSG + 50}
              ></textarea>
              <div className={counterCls}>{msg.length} / {MAX_MSG}</div>
              {errs.msg && <div className="err">{errs.msg}</div>}
            </div>
          </div>

          <div className="form-foot">
            <div className="note">
              ↪ Replies within ~24h. For urgent quests, ping me on the gold channel.
            </div>
            <button className={"send-btn " + (sending ? "sending" : "")} disabled={sending}>
              {sending ? (<><span className="spin"></span> DISPATCHING…</>) : "▶  SEND RAVEN"}
            </button>
          </div>
        </form>
      );
    }

    // ---------- SUCCESS ----------
    function SuccessCard({ receipt, onReset }) {
      const topicLabel = (TOPICS.find(t => t.id === receipt.topic) || {}).label || "—";
      const stamp = receipt.at.toLocaleString(undefined, {
        month: "short", day: "2-digit", hour: "2-digit", minute: "2-digit"
      }).toUpperCase();
      return (
        <div className="success" role="status" aria-live="polite">
          <div className="head">
            <span className="who">▸ RAVEN-MASTER</span>
            <span className="lvl">[QUEST RECEIVED]</span>
          </div>
          <p>
            <strong style={{color: "var(--accent-teal)"}}>Message dispatched.</strong> Your raven is in the air, {receipt.name.split(" ")[0] || "adventurer"}. I'll reply to <span style={{color: "var(--accent-gold)"}}>{receipt.email}</span> within ~24 hours — usually faster.
          </p>

          <div className="quest-row">
            <div className="meta"><span className="k">QUEST ID</span>      <span className="v gold">{receipt.id}</span></div>
            <div className="meta"><span className="k">TOPIC</span>         <span className="v">{topicLabel}</span></div>
            <div className="meta"><span className="k">SENT</span>          <span className="v teal">{stamp}</span></div>
            <div className="meta"><span className="k">CHARACTERS</span>    <span className="v">{receipt.msg.length}</span></div>
          </div>

          <div className="row-actions">
            <a className="home-btn" href="Home.html">↩  RETURN TO TOWN</a>
            <button className="reset-btn" type="button" onClick={onReset}>[ SEND ANOTHER ]</button>
          </div>
        </div>
      );
    }

    // ---------- CHANNELS CARD ----------
    function ChannelsCard() {
      const [copied, setCopied] = useState(null);
      const onCopy = async (val, key) => {
        try {
          await navigator.clipboard.writeText(val);
          setCopied(key);
          setTimeout(() => setCopied(null), 1400);
        } catch {
          setCopied(key);
          setTimeout(() => setCopied(null), 1400);
        }
      };
      return (
        <aside className="channels">
          <div className="channels-head">
            <span className="title">▸ DIRECT CHANNELS</span>
            <span className="online"><span className="dot"></span>ONLINE</span>
          </div>
          {CHANNELS.map(c => {
            const isLink = !!c.href;
            const Tag = isLink ? "a" : "div";
            const props = isLink ? { href: c.href, target: c.key === "email" ? undefined : "_blank", rel: "noreferrer" } : {};
            return (
              <Tag key={c.key} className={"channel " + c.cls} {...props}>
                <span className="icon">{c.icon}</span>
                <div style={{flex: 1, minWidth: 0}}>
                  <div className="label">{c.label}</div>
                  <div className="val">{c.val}</div>
                </div>
                {c.copy && (
                  <button
                    type="button"
                    className={"copy " + (copied === c.key ? "copied" : "")}
                    onClick={(ev) => { ev.preventDefault(); onCopy(c.val, c.key); }}
                  >
                    {copied === c.key ? "COPIED" : "COPY"}
                  </button>
                )}
              </Tag>
            );
          })}
          <div className="channels-foot">
            <div className="meta"><span className="k">STATUS</span>          <span className="v teal">▸ Open to quests</span></div>
            <div className="meta"><span className="k">RESPONSE</span>        <span className="v">~24 hours</span></div>
            <div className="meta"><span className="k">TIMEZONE</span>        <span className="v">UTC+5:30 (IST)</span></div>
            <div className="meta"><span className="k">PREFERRED</span>       <span className="v gold">Email</span></div>
          </div>
        </aside>
      );
    }

    // ---------- APP ----------
    function App() {
      const [receipt, setReceipt] = useState(null);

      return (
        <>
          <header className="nav">
            <a className="brand" href="Home.html">
              <span className="chip">RP</span> RAAJ.DEV
            </a>
            <nav className="links">
              <a href="Home.html">HOME</a>
              <a href="Quest Board.html">QUESTS</a>
              <a href="Character Sheet.html">ABOUT</a>
              <a href="Achievement Cabinet.html">CERTS</a>
              <a href="Battle Log.html">LOG</a>
              <a className="active" href="#">CONTACT</a>
            </nav>
            <span className="save">◆ SAVED · 02:14</span>
          </header>

          <section className="page-head">
            <div className="eyebrow">▸ CHAPTER 06 / CONTACT</div>
            <h1><Raven />SEND A RAVEN<Raven /></h1>
            <div className="sub">
              Drop a message. Quest offers, collabs, or just a hi — I read everything and reply within a day.
            </div>
          </section>

          <main className="layout">
            <ChannelsCard />
            {receipt
              ? <SuccessCard receipt={receipt} onReset={() => setReceipt(null)} />
              : <ContactForm onSent={setReceipt} />
            }
          </main>

          <footer className="foot">
            <div className="l">© 2026 RAAJ PATRE</div>
            <div className="c">BUILT WITH <span className="heart">♥</span> AND TOO MUCH COFFEE</div>
            <div className="r">v1.0.0 · LAST UPDATED MAY 2026</div>
          </footer>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
