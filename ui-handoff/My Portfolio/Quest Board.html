<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Quest Board — Raaj Patre</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&family=Press+Start+2P&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg-base:        #0a0c1a;
    --bg-surface:     #12152b;
    --bg-elevated:    #1a1e38;
    --text-primary:   #e8e8f0;
    --text-muted:     #6b7094;
    --accent-gold:    #f5c542;
    --accent-gold-2:  #ffd970;
    --accent-violet:  #7c6df5;
    --accent-teal:    #3dd6ac;
    --accent-red:     #f55c5c;
    --border-pixel:   #2a2d4a;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg-base);
    color: var(--text-primary);
    font-family: "JetBrains Mono", monospace;
    font-size: 14px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    image-rendering: pixelated;
    overflow-x: hidden;
  }

  /* ---------- STAR FIELD (shared ambient) ---------- */
  .stars {
    position: fixed; inset: 0;
    overflow: hidden; pointer-events: none; z-index: 0;
    background:
      radial-gradient(ellipse at 80% 0%, rgba(124,109,245,0.05), transparent 50%),
      radial-gradient(ellipse at 0% 100%, rgba(245,197,66,0.03), transparent 50%),
      var(--bg-base);
  }
  .stars::before, .stars::after {
    content: "";
    position: absolute; top: -50%; left: 0;
    width: 100%; height: 200%;
    background-repeat: repeat;
  }
  .stars::before {
    background-image:
      radial-gradient(1px 1px at 23px 47px, rgba(232,232,240,0.5), transparent 60%),
      radial-gradient(1px 1px at 167px 211px, rgba(232,232,240,0.6), transparent 60%),
      radial-gradient(1px 1px at 312px 256px, rgba(232,232,240,0.45), transparent 60%),
      radial-gradient(1.5px 1.5px at 401px 174px, rgba(232,232,240,0.4), transparent 60%),
      radial-gradient(1px 1px at 198px 360px, rgba(232,232,240,0.5), transparent 60%),
      radial-gradient(2px 2px at 355px 33px, rgba(245,197,66,0.5), transparent 60%);
    background-size: 480px 480px;
    animation: drift 120s linear infinite;
    opacity: 0.7;
  }
  .stars::after {
    background-image:
      radial-gradient(1.5px 1.5px at 55px 90px, rgba(124,109,245,0.5), transparent 60%),
      radial-gradient(1.5px 1.5px at 220px 30px, rgba(61,214,172,0.4), transparent 60%),
      radial-gradient(1.5px 1.5px at 380px 220px, rgba(232,232,240,0.5), transparent 60%);
    background-size: 540px 540px;
    animation: drift 80s linear infinite reverse;
    opacity: 0.7;
  }
  @keyframes drift {
    from { transform: translate3d(0,0,0); }
    to   { transform: translate3d(-40px, 80px, 0); }
  }

  /* ---------- NAV ---------- */
  .nav {
    position: sticky; top: 0; z-index: 30;
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px clamp(20px, 5vw, 64px);
    border-bottom: 1px solid var(--border-pixel);
    background: rgba(10,12,26,0.78);
    backdrop-filter: blur(6px);
  }
  .nav .brand {
    font-family: "Press Start 2P", monospace;
    font-size: 11px; color: var(--text-primary);
    display: flex; align-items: center; gap: 10px;
    text-decoration: none;
  }
  .nav .brand .chip {
    background: var(--accent-violet);
    color: var(--bg-base);
    padding: 4px 6px; font-size: 8px;
    box-shadow: 0 0 0 1px var(--accent-violet);
  }
  .nav .links { display: flex; gap: 22px; }
  .nav .links a {
    font-family: "Press Start 2P", monospace;
    font-size: 9px; color: var(--text-muted);
    text-decoration: none; letter-spacing: 0.05em;
  }
  .nav .links a:hover { color: var(--text-primary); }
  .nav .links a.active { color: var(--accent-gold); }
  .nav .save {
    font-family: "Press Start 2P", monospace;
    font-size: 8px; color: var(--accent-teal);
    border: 1px solid var(--border-pixel);
    box-shadow: 0 0 0 1px var(--border-pixel);
    padding: 6px 8px;
  }

  /* ---------- BANNER ---------- */
  .banner {
    position: relative; z-index: 1;
    height: 300px;
    display: flex; align-items: center; justify-content: center;
    border-bottom: 1px solid var(--border-pixel);
    overflow: hidden;
    background:
      url("assets/quest-banner.png") center / cover no-repeat,
      var(--bg-surface);
    image-rendering: pixelated;
  }
  /* dim overlay so title pops */
  .banner::before {
    content: "";
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 50% 50%, rgba(10,12,26,0.35) 0%, rgba(10,12,26,0.75) 90%),
      linear-gradient(to bottom, rgba(10,12,26,0.45) 0%, rgba(10,12,26,0.15) 30%, rgba(10,12,26,0.15) 70%, rgba(10,12,26,0.7) 100%);
    pointer-events: none;
  }
  @media (max-width: 720px) {
    .banner { height: 200px; }
  }

  /* nails in corners */
  .banner .nail-bl, .banner .nail-br, .banner .nail-tl, .banner .nail-tr {
    position: absolute; width: 8px; height: 8px;
    background: var(--border-pixel);
    box-shadow: 0 0 0 1px #000, inset 0 0 0 2px var(--bg-elevated);
    z-index: 2;
  }
  .banner .nail-tl { top: 14px; left: 14px; }
  .banner .nail-tr { top: 14px; right: 14px; }
  .banner .nail-bl { bottom: 14px; left: 14px; }
  .banner .nail-br { bottom: 14px; right: 14px; }

  .banner-inner {
    position: relative; z-index: 1;
    display: flex; align-items: center; gap: 24px;
    padding: 0 20px;
  }
  .banner h1 {
    font-family: "Press Start 2P", monospace;
    font-size: clamp(18px, 3.6vw, 28px);
    color: var(--accent-gold);
    margin: 0 0 10px;
    letter-spacing: 0.06em;
    text-shadow: 0 0 18px rgba(245,197,66,0.35);
  }
  .banner .sub {
    font-family: "JetBrains Mono", monospace;
    font-size: 13px;
    color: var(--text-muted);
    text-align: center;
  }
  .banner .text { text-align: center; }
  .swords {
    width: 56px; height: 56px;
    display: block;
    flex-shrink: 0;
  }
  @media (max-width: 540px) {
    .swords { width: 40px; height: 40px; }
    .banner-inner { gap: 14px; }
  }

  /* ---------- FILTER BAR ---------- */
  .filter-bar {
    position: sticky;
    top: 60px;
    z-index: 20;
    background: var(--bg-base);
    border-bottom: 1px solid var(--border-pixel);
    padding: 14px clamp(20px, 5vw, 64px);
    display: flex; align-items: center; gap: 24px; justify-content: space-between;
    flex-wrap: wrap;
  }
  .filter-group {
    display: flex; align-items: center; gap: 10px;
    flex-wrap: wrap;
  }
  .filter-label {
    font-family: "Press Start 2P", monospace;
    font-size: 8px;
    color: var(--text-muted);
    letter-spacing: 0.1em;
    margin-right: 4px;
  }
  .chip {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    color: var(--text-muted);
    background: transparent;
    border: 1px solid var(--border-pixel);
    box-shadow: 0 0 0 1px var(--border-pixel);
    padding: 6px 10px;
    border-radius: 2px;
    cursor: pointer;
    transition: color 140ms ease, border-color 140ms ease, background 140ms ease, box-shadow 140ms ease;
    letter-spacing: 0.02em;
    user-select: none;
  }
  .chip:hover {
    color: var(--accent-violet);
    border-color: var(--accent-violet);
    box-shadow: 0 0 0 1px var(--accent-violet);
  }
  .chip.active {
    background: var(--accent-violet);
    color: var(--bg-base);
    border-color: var(--accent-violet);
    box-shadow: 0 0 10px rgba(124,109,245,0.55), 0 0 0 1px var(--accent-violet);
  }
  .chip .glyph { margin-right: 6px; }
  .count-pill {
    font-family: "Press Start 2P", monospace;
    font-size: 7px;
    background: var(--accent-gold);
    color: var(--bg-base);
    box-shadow: 0 0 0 1px var(--accent-gold);
    padding: 6px 8px;
    border-radius: 2px;
    letter-spacing: 0.08em;
    white-space: nowrap;
  }
  .clear-link {
    font-family: "Press Start 2P", monospace;
    font-size: 7px;
    color: var(--text-muted);
    background: transparent;
    border: 1px solid var(--border-pixel);
    box-shadow: 0 0 0 1px var(--border-pixel);
    padding: 6px 8px;
    cursor: pointer;
    border-radius: 2px;
  }
  .clear-link:hover { color: var(--accent-violet); border-color: var(--accent-violet); box-shadow: 0 0 0 1px var(--accent-violet); }

  /* ---------- GRID ---------- */
  .grid-wrap {
    position: relative; z-index: 1;
    padding: 32px clamp(20px, 5vw, 64px) 80px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
  }
  @media (max-width: 1100px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 700px)  { .grid { grid-template-columns: 1fr; } }

  /* ---------- QUEST CARD ---------- */
  .card {
    position: relative;
    background: var(--bg-surface);
    border: 2px solid var(--border-pixel);
    box-shadow: 0 0 0 1px var(--border-pixel);
    border-radius: 2px;
    display: flex; flex-direction: column;
    overflow: hidden;
    transition: transform 200ms ease, box-shadow 200ms ease, border-color 200ms ease;
    opacity: 0;
    transform: translateY(20px);
  }
  .card.enter {
    animation: cardIn 420ms ease-out forwards;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .card.leaving { animation: cardOut 150ms ease-in forwards; }
  @keyframes cardOut {
    from { opacity: 1; transform: translateY(0); }
    to   { opacity: 0; transform: translateY(8px); }
  }
  .card:hover {
    transform: translateY(-4px);
    border-color: var(--accent-violet);
    box-shadow: 0 0 16px rgba(124,109,245,0.25), 0 0 0 1px var(--accent-violet);
  }
  .card.legendary {
    border-color: var(--accent-gold);
    box-shadow: 0 0 0 1px var(--accent-gold);
    animation: cardIn 420ms ease-out forwards, goldShimmer 2s linear infinite 420ms;
  }
  @keyframes goldShimmer {
    0%, 100% { border-color: var(--accent-gold); box-shadow: 0 0 0 1px var(--accent-gold); }
    50%      { border-color: var(--accent-gold-2); box-shadow: 0 0 12px rgba(255,217,112,0.45), 0 0 0 1px var(--accent-gold-2); }
  }
  .card.legendary:hover {
    transform: translateY(-4px);
    box-shadow: 0 0 24px rgba(245,197,66,0.3), 0 0 0 1px var(--accent-gold);
  }

  .status-bar {
    height: 4px;
    width: 0;
    background: var(--accent-teal);
    animation: barIn 360ms ease-out 80ms forwards;
  }
  .status-bar.shipped { background: var(--accent-teal); }
  .status-bar.wip     { background: var(--accent-red); }
  .status-bar.gold    { background: var(--accent-gold); }
  @keyframes barIn {
    from { width: 0; }
    to   { width: 100%; }
  }

  .card-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 16px 6px;
    gap: 10px;
  }
  .qst-id {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.06em;
    white-space: nowrap;
  }
  .status-badge {
    font-family: "Press Start 2P", monospace;
    font-size: 7px;
    padding: 5px 7px;
    border-radius: 2px;
    letter-spacing: 0.08em;
  }
  .status-badge.shipped {
    color: var(--accent-teal);
    background: rgba(61,214,172,0.15);
    box-shadow: 0 0 0 1px rgba(61,214,172,0.4);
  }
  .status-badge.wip {
    color: var(--accent-red);
    background: rgba(245,92,92,0.15);
    box-shadow: 0 0 0 1px rgba(245,92,92,0.4);
  }
  .status-badge.wip::before { content: "▶ "; }
  .status-badge.shipped::before { content: "◆ "; }

  .card-title {
    padding: 4px 16px 10px;
    font-family: "JetBrains Mono", monospace;
    font-size: 17px;
    font-weight: 700;
    color: var(--text-primary);
    letter-spacing: 0.01em;
  }
  .card-tagline {
    padding: 0 16px 14px;
    font-family: "JetBrains Mono", monospace;
    font-size: 12px;
    color: var(--text-muted);
    font-style: italic;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    min-height: 38px;
  }
  .divider {
    height: 1px; background: var(--border-pixel);
    margin: 0 12px;
  }

  .tags {
    display: flex; flex-wrap: wrap; gap: 6px;
    padding: 12px 16px 0;
  }
  .tag {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    color: var(--accent-violet);
    background: rgba(124,109,245,0.12);
    border: 1px solid var(--accent-violet);
    box-shadow: 0 0 0 1px var(--accent-violet);
    padding: 2px 6px;
    border-radius: 2px;
    letter-spacing: 0.02em;
  }
  .tag.more {
    color: var(--text-muted);
    background: transparent;
    border-color: var(--border-pixel);
    box-shadow: 0 0 0 1px var(--border-pixel);
  }

  .card-spacer { flex: 1; }
  .card-foot {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px 16px;
    margin-top: 12px;
    gap: 8px;
  }
  .foot-links { display: flex; gap: 12px; }
  .foot-link {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    color: var(--text-muted);
    background: transparent; border: none; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 0;
    transition: color 150ms ease;
    text-decoration: none;
  }
  .foot-link svg { width: 13px; height: 13px; }
  .foot-link.repo:hover { color: var(--accent-violet); }
  .foot-link.live:hover { color: var(--accent-teal); }
  .inspect {
    font-family: "Press Start 2P", monospace;
    font-size: 7px;
    color: var(--text-muted);
    background: transparent; border: none; cursor: pointer;
    letter-spacing: 0.08em;
    transition: color 150ms ease;
  }
  .inspect:hover { color: var(--accent-gold); }

  .legendary-badge {
    position: absolute;
    top: 8px;
    right: 8px;
    font-family: "Press Start 2P", monospace;
    font-size: 7px;
    color: var(--bg-base);
    background: var(--accent-gold);
    padding: 5px 8px 5px 7px;
    letter-spacing: 0.08em;
    box-shadow: 0 0 0 1px var(--bg-base);
    z-index: 2;
    /* notched/stepped corner: pixel-cut */
    clip-path: polygon(
      0 0,
      100% 0,
      100% calc(100% - 6px),
      calc(100% - 6px) 100%,
      0 100%
    );
  }
  .legendary-badge::before { content: "⭐ "; }

  /* ---------- EMPTY STATE ---------- */
  .empty {
    grid-column: 1 / -1;
    display: flex; flex-direction: column; align-items: center;
    gap: 16px;
    padding: 56px 20px 24px;
    text-align: center;
  }
  .empty .icon-box {
    width: 128px; height: 128px;
    border: 2px dashed var(--border-pixel);
    box-shadow: 0 0 0 1px var(--border-pixel);
    background: var(--bg-surface);
    display: flex; align-items: center; justify-content: center;
    color: var(--text-muted);
    font-family: "Press Start 2P", monospace;
    font-size: 8px;
    animation: idleBounce 1.6s ease-in-out infinite;
  }
  @keyframes idleBounce {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-2px); }
  }
  .empty .title {
    font-family: "Press Start 2P", monospace;
    font-size: 14px;
    color: var(--text-muted);
    letter-spacing: 0.06em;
  }
  .empty .sub {
    font-family: "JetBrains Mono", monospace;
    font-size: 13px;
    color: var(--text-muted);
  }
  .btn-violet {
    font-family: "Press Start 2P", monospace;
    font-size: 9px;
    color: var(--bg-base);
    background: var(--accent-violet);
    border: 2px solid var(--accent-violet);
    box-shadow: 0 0 0 1px var(--accent-violet);
    padding: 12px 16px;
    cursor: pointer;
    border-radius: 2px;
    letter-spacing: 0.08em;
    transition: transform 150ms ease, box-shadow 150ms ease, filter 150ms ease;
  }
  .btn-violet:hover {
    transform: scale(1.03);
    box-shadow: 0 0 16px var(--accent-violet), 0 0 0 1px var(--accent-violet);
    filter: brightness(1.08);
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg-base); }
  ::-webkit-scrollbar-thumb { background: var(--border-pixel); border: 2px solid var(--bg-base); }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent-violet); }

  ::selection { background: var(--accent-violet); color: var(--bg-base); }

  /* ---------- COVER IMAGE ON CARD ---------- */
  .cover {
    position: relative;
    aspect-ratio: 16 / 9;
    background:
      repeating-linear-gradient(
        45deg,
        rgba(124,109,245,0.06) 0 8px,
        rgba(124,109,245,0.02) 8px 16px
      ),
      var(--bg-elevated);
    border-bottom: 1px solid var(--border-pixel);
    overflow: hidden;
    cursor: pointer;
  }
  .cover image-slot {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    --image-slot-bg: transparent;
  }
  .card.legendary .cover { border-bottom-color: var(--accent-gold); }
  .cover .corner-icon {
    position: absolute;
    left: 10px; top: 10px;
    width: 28px; height: 28px;
    background: rgba(10,12,26,0.78);
    border: 1px solid var(--border-pixel);
    box-shadow: 0 0 0 1px var(--border-pixel);
    display: flex; align-items: center; justify-content: center;
    font-family: "Press Start 2P", monospace;
    font-size: 12px;
    color: var(--accent-gold);
    backdrop-filter: blur(3px);
    z-index: 2;
  }
  .cover .photo-count {
    position: absolute;
    right: 10px; bottom: 10px;
    background: rgba(10,12,26,0.78);
    color: var(--text-primary);
    border: 1px solid var(--border-pixel);
    box-shadow: 0 0 0 1px var(--border-pixel);
    font-family: "Press Start 2P", monospace;
    font-size: 7px;
    padding: 5px 7px;
    letter-spacing: 0.1em;
    z-index: 2;
    backdrop-filter: blur(3px);
  }
  .cover .photo-count.violet { color: var(--accent-violet); border-color: var(--accent-violet); box-shadow: 0 0 0 1px var(--accent-violet); }
  .cover .photo-count.gold   { color: var(--accent-gold);  border-color: var(--accent-gold);  box-shadow: 0 0 0 1px var(--accent-gold); }

  /* ---------- MODAL ---------- */
  .modal-overlay {
    position: fixed; inset: 0;
    z-index: 100;
    background: rgba(10,12,26,0.86);
    backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    animation: mfadeIn 180ms ease-out;
  }
  @keyframes mfadeIn { from { opacity: 0; } to { opacity: 1; } }

  .modal {
    width: min(1040px, 100%);
    max-height: calc(100vh - 48px);
    background: var(--bg-surface);
    border: 2px solid var(--mcat, var(--accent-violet));
    box-shadow: 0 0 28px var(--mcat, var(--accent-violet)), 0 0 0 1px var(--mcat, var(--accent-violet));
    border-radius: 2px;
    display: flex; flex-direction: column;
    overflow: hidden;
    animation: modalIn 220ms cubic-bezier(.2,.7,.2,1);
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.94); }
    to   { opacity: 1; transform: scale(1); }
  }
  .modal-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border-pixel);
    gap: 12px;
  }
  .modal-head .left { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .modal-head .qst-id {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.06em;
  }
  .modal-head .name {
    font-family: "JetBrains Mono", monospace;
    font-size: 17px;
    font-weight: 700;
    color: var(--text-primary);
    white-space: nowrap;
  }
  .modal-close {
    font-family: "Press Start 2P", monospace;
    font-size: 8px;
    color: var(--text-muted);
    background: transparent;
    border: 1px solid var(--border-pixel);
    box-shadow: 0 0 0 1px var(--border-pixel);
    padding: 7px 10px;
    cursor: pointer;
    border-radius: 2px;
    letter-spacing: 0.1em;
  }
  .modal-close:hover { color: var(--text-primary); border-color: var(--text-muted); box-shadow: 0 0 0 1px var(--text-muted); }

  .modal-body {
    display: grid;
    grid-template-columns: minmax(0, 1.4fr) minmax(300px, 1fr);
    overflow: auto;
  }
  .modal-body.no-photos { grid-template-columns: 1fr; }
  @media (max-width: 860px) { .modal-body { grid-template-columns: 1fr; } }

  .carousel {
    position: relative;
    background: var(--bg-base);
    border-right: 1px solid var(--border-pixel);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    user-select: none;
    min-height: 320px;
  }
  @media (max-width: 860px) { .carousel { border-right: none; border-bottom: 1px solid var(--border-pixel); } }
  .carousel-stage {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 10;
    max-height: 560px;
    background:
      linear-gradient(rgba(124,109,245,0.04) 1px, transparent 1px) 0 0 / 32px 32px,
      linear-gradient(90deg, rgba(124,109,245,0.04) 1px, transparent 1px) 0 0 / 32px 32px,
      var(--bg-base);
  }
  .carousel-stage image-slot {
    position: absolute; inset: 14px;
    width: calc(100% - 28px);
    height: calc(100% - 28px);
    --image-slot-bg: transparent;
  }
  .carousel-nav {
    position: absolute;
    top: 50%; transform: translateY(-50%);
    width: 38px; height: 38px;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg-surface);
    color: var(--text-primary);
    border: 2px solid var(--mcat, var(--accent-violet));
    box-shadow: 0 0 10px var(--mcat, var(--accent-violet)), 0 0 0 1px var(--mcat, var(--accent-violet));
    border-radius: 2px;
    cursor: pointer;
    font-family: "Press Start 2P", monospace;
    font-size: 12px;
    z-index: 5;
    transition: transform 150ms ease, filter 150ms ease;
  }
  .carousel-nav:hover { filter: brightness(1.15); transform: translateY(-50%) scale(1.05); }
  .carousel-nav.prev { left: 12px; }
  .carousel-nav.next { right: 12px; }

  .carousel-meta {
    position: absolute;
    top: 14px; left: 14px;
    font-family: "Press Start 2P", monospace;
    font-size: 7px;
    color: var(--text-muted);
    background: rgba(10,12,26,0.78);
    box-shadow: 0 0 0 1px var(--border-pixel);
    padding: 6px 8px;
    letter-spacing: 0.1em;
    z-index: 4;
  }
  .carousel-dots {
    position: absolute;
    bottom: 14px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 6px; z-index: 4;
  }
  .carousel-dots .dot {
    width: 8px; height: 8px;
    background: transparent;
    box-shadow: 0 0 0 1px var(--border-pixel);
    cursor: pointer;
  }
  .carousel-dots .dot.active {
    background: var(--mcat, var(--accent-violet));

  .modal-text {
    padding: 20px 22px;
    overflow: auto;
    display: flex; flex-direction: column; gap: 14px;
  }
  .modal-text .tagline {
    font-family: "JetBrains Mono", monospace;
    font-size: 14px;

  }

  .modal-text h4 {
    font-family: "Press Start 2P", monospace;
    font-size: 8px;
    color: var(--text-muted);
    letter-spacing: 0.12em;
    margin: 6px 0 -2px;
  }
  .modal-text .stat-row {
    display: flex; justify-content: space-between;
    font-family: "Press Start 2P", monospace;
    font-size: 7px;
    color: var(--text-muted);
    letter-spacing: 0.08em;
    padding: 2px 0;
  }
  .modal-text .stat-row .v.gold { color: var(--accent-gold); }
  .modal-text .stat-row .v.teal { color: var(--accent-teal); }
  .modal-text .stat-row .v.violet { color: var(--accent-violet); }
  .modal-text .links-row {
    display: flex; gap: 10px; flex-wrap: wrap;

  }
  .modal-text .lbtn {
    font-family: "Press Start 2P", monospace;
    font-size: 8px;
    color: var(--mcat, var(--accent-violet));
    background: transparent;
    border: 2px solid var(--mcat, var(--accent-violet));

  }
  .modal-text .lbtn:hover { background: var(--mcat, var(--accent-violet)); color: var(--bg-base); }

  .photo-grid {
    display: grid;

  .photo-grid .mini {
    aspect-ratio: 1 / 1;

    box-shadow: 0 0 0 1px var(--border-pixel);

  }
  .photo-grid .mini.active {
    border-color: var(--mcat);

  }
  .photo-grid image-slot {

  .help {

    padding: 3px 5px;

    font-family: "Press Start 2P", monospace;

</style>

    // ---------- FILTER BAR ----------
    function FilterBar({ status, setStatus, activeTags, toggleTag, allTags, count, hasActive, clearAll }) {
      return (
        <div className="filter-bar">
          <div className="filter-group">
            <span className="filter-label">STATUS</span>
            {[
              { key: "ALL", label: "ALL", glyph: "◆" },
              { key: "SHIPPED", label: "SHIPPED", glyph: "✓" },
              { key: "IN_PROGRESS", label: "IN PROGRESS", glyph: "▶" },
            ].map(s => (
              <button
                key={s.key}
                className={"chip " + (status === s.key ? "active" : "")}

                <span className="glyph">{s.glyph}</span>{s.label}

          <div className="filter-group" style={{ flex: 1, justifyContent: "flex-end" }}>
            <span className="filter-label">STACK</span>
            {allTags.map(t => (
              <button
                key={t}
                className={"chip " + (activeTags.includes(t) ? "active" : "")}

              >
                {t}
              </button>

            <span className="count-pill">{count} QUEST{count === 1 ? "" : "S"}</span>
            {hasActive && (
              <button className="clear-link" onClick={clearAll}>[ CLEAR ]</button>
            )}
          </div>
        </div>
      );

    // ---------- QUEST CARD ----------
    function QuestCard({ q, index, onOpen }) {
      const ref = useRef(null);
      const [enter, setEnter] = useState(false);

      useEffect(() => {
        // staggered fade-up
        const t = setTimeout(() => setEnter(true), index * 40);
        return () => clearTimeout(t);
      }, [index]);

      const isShipped = q.status === "SHIPPED";
      const visibleTags = q.tags.slice(0, 5);
      const more = q.tags.length - visibleTags.length;
      const photoCount = q.photos || 0;

      return (
        <article
          ref={ref}
          className={"card " + (enter ? "enter " : "") + (q.legendary ? "legendary" : "")}
        >
          {q.legendary && <span className="legendary-badge">LEGENDARY</span>}

          <div className={"status-bar " + (q.legendary ? "gold" : (isShipped ? "shipped" : "wip"))}></div>

          {photoCount > 0 && (
            <div className="cover" onClick={() => onOpen(q)} title="Open quest details">
              <image-slot
                id={`quest-${q.slug}-cover`}
                shape="rect"
                radius="0"
                placeholder="Drop cover image"
              ></image-slot>
              <span className="corner-icon" aria-hidden="true">{q.icon}</span>
              {photoCount > 1 && (
                <span className={"photo-count " + (q.legendary ? "gold" : "violet")}>

                </span>

            </div>

            <span className="qst-id">{q.id}</span>
            <span className={"status-badge " + (isShipped ? "shipped" : "wip")}>
              {isShipped ? "SHIPPED" : "IN PROGRESS"}

          <div className="card-title">{q.name}</div>
          <div className="card-tagline">{q.tagline}</div>

          <div className="divider"></div>

          <div className="tags">
            {visibleTags.map(t => <span key={t} className="tag">{t}</span>)}
            {more > 0 && <span className="tag more">+{more}</span>}
          </div>

          <div className="card-spacer"></div>

          <div className="card-foot">
            <div className="foot-links">
              <a className="foot-link repo" href={q.repo || "#"} target="_blank" rel="noreferrer">
                {RepoIcon} REPO
              </a>
              {q.live && (

                  {LiveIcon} LIVE

    }

    // ---------- MODAL ----------
    function QuestModal({ q, onClose }) {
      const photoCount = q.photos || 0;
      const [idx, setIdx] = useState(0);
      const isShipped = q.status === "SHIPPED";
      const mcat = q.legendary ? "var(--accent-gold)" : (isShipped ? "var(--accent-teal)" : "var(--accent-red)");

      const prev = () => setIdx(i => (photoCount > 0 ? (i - 1 + photoCount) % photoCount : 0));
      const next = () => setIdx(i => (photoCount > 0 ? (i + 1) % photoCount : 0));

      useEffect(() => {
        const k = (ev) => {
          if (ev.key === "Escape") onClose();
          else if (ev.key === "ArrowLeft") prev();
          else if (ev.key === "ArrowRight") next();
        };
        window.addEventListener("keydown", k);
        document.body.style.overflow = "hidden";
        return () => {
          window.removeEventListener("keydown", k);
          document.body.style.overflow = "";
        };
      }, [photoCount]);

      const dragRef = useRef({ active: false, x0: 0 });
      const onDown = (ev) => {
        dragRef.current = { active: true, x0: ev.touches ? ev.touches[0].clientX : ev.clientX };
      };
      const onUp = (ev) => {
        if (!dragRef.current.active) return;
        const x1 = ev.changedTouches ? ev.changedTouches[0].clientX : ev.clientX;
        const dx = x1 - dragRef.current.x0;
        dragRef.current.active = false;
        if (Math.abs(dx) > 50) { dx < 0 ? next() : prev(); }
      };

      return (
        <div
          className="modal-overlay"
          onClick={onClose}
          role="dialog"
          aria-modal="true"
          style={{ "--mcat": mcat }}
        >
          <div className="modal" onClick={(ev) => ev.stopPropagation()}>
            <div className="modal-head">
              <div className="left">
                <span className="qst-id">{q.id}</span>
                <span className="name">{q.name}</span>
                {q.legendary && <span className="legendary-badge" style={{ position: "static", display: "inline-block" }}>LEGENDARY</span>}
                <span className={"status-badge " + (isShipped ? "shipped" : "wip")}>
                  {isShipped ? "SHIPPED" : "IN PROGRESS"}
                </span>
              </div>
              <button className="modal-close" onClick={onClose} aria-label="Close">× ESC</button>
            </div>

            <div className={"modal-body " + (photoCount === 0 ? "no-photos" : "")}>
              {photoCount > 0 && (
                <div
                  className="carousel"
                  onMouseDown={onDown} onMouseUp={onUp}
                  onTouchStart={onDown} onTouchEnd={onUp}
                >
                  <span className="carousel-meta">PHOTO {idx + 1} / {photoCount}</span>
                  <div className="carousel-stage">
                    <image-slot
                      key={`big-${q.slug}-${idx}`}
                      id={idx === 0 ? `quest-${q.slug}-cover` : `quest-${q.slug}-photo-${idx}`}
                      shape="rect"
                      radius="0"
                      placeholder="Drop your photo here"
                    ></image-slot>
                  </div>
                  {photoCount > 1 && (
                    <>
                      <button className="carousel-nav prev" onClick={prev} aria-label="Previous photo">◀</button>
                      <button className="carousel-nav next" onClick={next} aria-label="Next photo">▶</button>
                      <div className="carousel-dots">
                        {Array.from({length: photoCount}).map((_, i) => (
                          <span
                            key={i}
                            className={"dot " + (i === idx ? "active" : "")}
                            onClick={() => setIdx(i)}
                          ></span>
                        ))}
                      </div>
                    </>
                  )}
                </div>
              )}

              <div className="modal-text">
                <div className="tagline">{q.tagline}</div>
                {q.detail && <div className="detail">{q.detail}</div>}

                <h4>STACK</h4>
                <div className="tags">
                  {q.tags.map(t => <span key={t} className="tag">{t}</span>)}
                </div>

                {photoCount > 0 && (
                  <>
                    <h4>▸ GALLERY ({photoCount})</h4>
                    <div className="photo-grid">
                      {Array.from({length: photoCount}).map((_, i) => (
                        <div
                          key={i}
                          className={"mini " + (i === idx ? "active" : "")}
                          onClick={() => setIdx(i)}
                          title={`Open photo ${i+1}`}
                        >
                          <image-slot
                            id={i === 0 ? `quest-${q.slug}-cover` : `quest-${q.slug}-photo-${i}`}
                            shape="rect"
                            radius="0"
                            placeholder=" "
                          ></image-slot>
                        </div>
                      ))}
                    </div>
                  </>
                )}

                <h4>STATS</h4>
                <div>
                  <div className="stat-row"><span>DROPS</span><span className="v gold">{q.stats.drops}</span></div>
                  <div className="stat-row"><span>BOSS</span>  <span className="v teal">{q.stats.boss}</span></div>
                  <div className="stat-row"><span>LOOT</span>  <span className="v violet">{q.stats.loot}</span></div>
                </div>

                <div className="links-row">
                  {q.repo && (
                    <a className="lbtn" href={q.repo} target="_blank" rel="noreferrer">{RepoIcon} REPO</a>
                  )}
                  {q.live && (
                    <a className="lbtn" href={q.live} target="_blank" rel="noreferrer">{LiveIcon} LIVE</a>
                  )}
                </div>

                {photoCount > 0 && (
                  <div className="help">
                    <kbd>←</kbd> <kbd>→</kbd> NAVIGATE · <kbd>ESC</kbd> CLOSE · DRAG/SWIPE
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ---------- EMPTY ----------
    function Empty({ onClear }) {
      return (
        <div className="empty">
          <div className="icon-box">[ ? ]</div>
          <div className="title">NO QUESTS FOUND</div>
          <div className="sub">Try a different filter, adventurer.</div>
          <button className="btn-violet" onClick={onClear}>[ CLEAR FILTERS ]</button>
        </div>
      );
    }

    // ---------- APP ----------
    function App() {
      const [status, setStatus] = useState("ALL");
      const [activeTags, setActiveTags] = useState([]);
      const [phase, setPhase] = useState("in"); // 'in' | 'out'
      const [shownStatus, setShownStatus] = useState(status);
      const [shownTags, setShownTags] = useState(activeTags);
      const [openQuest, setOpenQuest] = useState(null);

      const allTags = useMemo(() => topTags(QUESTS, 8), []);

      // Fade out / in on filter change
      useEffect(() => {
        if (status === shownStatus && JSON.stringify(activeTags) === JSON.stringify(shownTags)) return;
        setPhase("out");
        const t = setTimeout(() => {
          setShownStatus(status);
          setShownTags(activeTags);
          setPhase("in");
        }, 150);
        return () => clearTimeout(t);
      }, [status, activeTags]);

      const filtered = useMemo(() => {
        return QUESTS.filter(q => {
          if (shownStatus !== "ALL" && q.status !== shownStatus) return false;
          if (shownTags.length && !shownTags.every(t => q.tags.includes(t))) return false;
          return true;
        });
      }, [shownStatus, shownTags]);

      const toggleTag = (t) => {
        setActiveTags(prev => prev.includes(t) ? prev.filter(x => x !== t) : [...prev, t]);
      };
      const clearAll = () => { setStatus("ALL"); setActiveTags([]); };
      const hasActive = status !== "ALL" || activeTags.length > 0;

      return (
        <>
          <header className="nav">
            <a className="brand" href="Home.html">
              <span className="chip">RP</span> RAAJ.DEV
            </a>
            <nav className="links">
              <a href="Home.html">HOME</a>
              <a className="active" href="#">QUESTS</a>
              <a href="Character Sheet.html">ABOUT</a>
              <a href="Achievement Cabinet.html">CERTS</a>
              <a href="Battle Log.html">LOG</a>
              <a href="Contact.html">CONTACT</a>
            </nav>
            <span className="save">◆ SAVED · 02:14</span>
          </header>

          <section className="banner">
            <span className="nail-tl"></span><span className="nail-tr"></span>
            <span className="nail-bl"></span><span className="nail-br"></span>
            <div className="banner-inner">
              <CrossedSwords />
              <div className="text">
                <h1>QUEST BOARD</h1>
                <div className="sub">Active missions. Shipped builds. Work in progress.</div>
              </div>
              <CrossedSwords flip />
            </div>
          </section>

          <FilterBar
            status={status} setStatus={setStatus}
            activeTags={activeTags} toggleTag={toggleTag}
            allTags={allTags}
            count={filtered.length}
            hasActive={hasActive}
            clearAll={clearAll}
          />

          <main className="grid-wrap">
            <div className="grid" style={{ opacity: phase === "out" ? 0 : 1, transition: "opacity 150ms ease" }}>
              {filtered.length === 0 ? (
                <Empty onClear={clearAll} />
              ) : (
                filtered.map((q, i) => <QuestCard key={q.id} q={q} index={i} onOpen={setOpenQuest} />)
              )}
            </div>
          </main>

          {openQuest && <QuestModal q={openQuest} onClose={() => setOpenQuest(null)} />}
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
