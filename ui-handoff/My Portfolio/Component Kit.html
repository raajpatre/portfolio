<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Component Kit — Raaj Patre</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Press+Start+2P&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg-base:        #0a0c1a;
    --bg-surface:     #12152b;
    --bg-elevated:    #1a1e38;
    --text-primary:   #e8e8f0;
    --text-muted:     #6b7094;
    --accent-gold:    #f5c542;
    --accent-violet:  #7c6df5;
    --accent-teal:    #3dd6ac;
    --accent-red:     #f55c5c;
    --border-pixel:   #2a2d4a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg-base);
    color: var(--text-primary);
    font-family: "JetBrains Mono", monospace;
    font-size: 14px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    image-rendering: pixelated;
    overflow-x: hidden;
    min-height: 100vh;
  }
  ::selection { background: var(--accent-violet); color: var(--bg-base); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg-base); }
  ::-webkit-scrollbar-thumb { background: var(--border-pixel); border: 2px solid var(--bg-base); }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent-violet); }

  /* ---------- STAR FIELD (hero) ---------- */
  .stars-hero {
    position: absolute; inset: 0;
    pointer-events: none; overflow: hidden;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(124,109,245,0.07), transparent 60%),
      radial-gradient(ellipse at 80% 80%, rgba(245,197,66,0.05), transparent 60%),
      var(--bg-base);
  }
  .stars-hero::before, .stars-hero::after {
    content: ""; position: absolute; top: -50%; left: 0;
    width: 100%; height: 200%;
    background-repeat: repeat;
  }
  .stars-hero::before {
    background-image:
      radial-gradient(1px 1px at 23px 47px, rgba(232,232,240,0.55), transparent 60%),
      radial-gradient(1px 1px at 167px 211px, rgba(232,232,240,0.5), transparent 60%),
      radial-gradient(1.5px 1.5px at 312px 256px, rgba(232,232,240,0.45), transparent 60%),
      radial-gradient(2px 2px at 401px 174px, rgba(245,197,66,0.55), transparent 60%),
      radial-gradient(1px 1px at 67px 312px, rgba(232,232,240,0.45), transparent 60%);
    background-size: 480px 480px;
    animation: drift 120s linear infinite;
    opacity: 0.85;
  }
  .stars-hero::after {
    background-image:
      radial-gradient(1.5px 1.5px at 55px 90px, rgba(124,109,245,0.6), transparent 60%),
      radial-gradient(1.5px 1.5px at 220px 30px, rgba(232,232,240,0.5), transparent 60%),
      radial-gradient(1.5px 1.5px at 380px 220px, rgba(61,214,172,0.5), transparent 60%);
    background-size: 540px 540px;
    animation: drift 80s linear infinite reverse;
    opacity: 0.7;
  }
  @keyframes drift {
    from { transform: translate3d(0,0,0); }
    to   { transform: translate3d(-40px, 80px, 0); }
  }

  /* ---------- TOP NAV ---------- */
  .nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 40;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px clamp(20px, 5vw, 64px);
    background: transparent;
    border-bottom: 1px solid transparent;
    transition: background 220ms ease, border-color 220ms ease, backdrop-filter 220ms ease;
  }
  .nav.scrolled {
    background: rgba(18,21,43,0.9);
    border-bottom: 1px solid var(--border-pixel);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .nav .brand {
    display: flex; align-items: center; gap: 12px;
    text-decoration: none;
  }
  .nav .brand .avatar {
    width: 32px; height: 32px;
    background: var(--accent-violet);
    border: 2px solid var(--accent-violet);
    box-shadow: 0 0 0 1px var(--accent-violet);
    border-radius: 2px;
    display: flex; align-items: center; justify-content: center;
    font-family: "Press Start 2P", monospace;
    font-size: 10px;
    color: var(--bg-base);
  }
  .nav .brand .title {
    font-family: "Press Start 2P", monospace;
    font-size: 11px;
    color: var(--text-primary);
    letter-spacing: 0.06em;
    transition: text-shadow 200ms ease, color 200ms ease;
  }
  .nav .brand:hover .title {
    color: var(--accent-gold);
    text-shadow: 0 0 12px rgba(245,197,66,0.6);
  }

  .nav .links {
    display: flex; gap: 6px;
  }
  .nav .links a {
    position: relative;
    font-family: "Press Start 2P", monospace;
    font-size: 8px;
    color: var(--text-muted);
    text-decoration: none;
    letter-spacing: 0.1em;
    padding: 14px 12px;
    border-bottom: 2px solid transparent;
    transition: color 200ms ease, border-color 200ms ease;
  }
  .nav .links a:hover { color: var(--text-primary); }
  .nav .links a.active {
    color: var(--text-primary);
    border-bottom-color: var(--accent-violet);
  }
  /* pixel cursor */
  .nav .links a::before {
    content: "";
    position: absolute;
    left: 0; top: 50%;
    transform: translate(-2px, -50%);
    width: 4px; height: 4px;
    background: var(--accent-violet);
    box-shadow: 0 0 6px var(--accent-violet);
    opacity: 0;
  }
  .nav .links a:hover::before {
    animation: cursorBlink 700ms steps(2) infinite;
  }
  @keyframes cursorBlink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  .nav .cta {
    font-family: "Press Start 2P", monospace;
    font-size: 8px;
    letter-spacing: 0.1em;
    color: var(--accent-gold);
    background: transparent;
    border: 2px solid var(--accent-gold);
    box-shadow: 0 0 0 1px var(--accent-gold);
    padding: 9px 12px;
    cursor: pointer;
    border-radius: 2px;
    transition: background 150ms ease, color 150ms ease, box-shadow 150ms ease;
  }
  .nav .cta:hover {
    background: var(--accent-gold);
    color: var(--bg-base);
    box-shadow: 0 0 12px var(--accent-gold), 0 0 0 1px var(--accent-gold);
  }

  .nav .hamburger {
    display: none;
    background: transparent;
    border: 1px solid var(--border-pixel);
    box-shadow: 0 0 0 1px var(--border-pixel);
    padding: 8px;
    cursor: pointer;
    border-radius: 2px;
  }
  .nav .hamburger:hover { border-color: var(--accent-violet); box-shadow: 0 0 0 1px var(--accent-violet); }
  .hamburger .bar {
    display: block;
    width: 18px; height: 2px;
    background: var(--text-primary);
    margin: 3px 0;
  }

  @media (max-width: 820px) {
    .nav .links, .nav .cta { display: none; }
    .nav .hamburger { display: block; }
  }

  /* ---------- MOBILE MENU ---------- */
  .mobile-menu {
    position: fixed;
    top: 0; right: 0; bottom: 0;
    width: 100%;
    background: rgba(10,12,26,0.98);
    backdrop-filter: blur(10px);
    z-index: 60;
    transform: translateX(100%);
    transition: transform 250ms ease;
    display: flex; flex-direction: column;
    padding: 24px;
  }
  .mobile-menu.open { transform: translateX(0); }
  .mobile-menu .top {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 24px;
  }
  .mobile-menu .close {
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border-pixel);
    box-shadow: 0 0 0 1px var(--border-pixel);
    width: 36px; height: 36px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    border-radius: 2px;
    font-family: "Press Start 2P", monospace;
    font-size: 10px;
  }
  .mobile-menu .close:hover { color: var(--text-primary); }
  .mobile-menu .links {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    flex: 1;
  }
  .mobile-menu .links a {
    font-family: "Press Start 2P", monospace;
    font-size: 14px;
    color: var(--text-primary);
    text-decoration: none;
    padding: 24px 16px;
    letter-spacing: 0.12em;
  }
  .mobile-menu .links a.active { color: var(--accent-violet); }
  .mobile-menu .links a:hover  { color: var(--accent-gold); }
  .mobile-menu .footer-line {
    text-align: center;
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    color: var(--text-muted);
    padding: 16px;
  }

  /* ---------- HERO ---------- */
  .hero {
    position: relative;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 120px clamp(20px, 5vw, 64px) 80px;
    text-align: center;
  }
  .hero-inner { position: relative; z-index: 2; max-width: 760px; }
  .hero-eyebrow {
    font-family: "Press Start 2P", monospace;
    font-size: 8px;
    color: var(--accent-violet);
    letter-spacing: 0.3em;
    margin-bottom: 18px;
  }
  .hero h1 {
    font-family: "Press Start 2P", monospace;
    font-size: clamp(22px, 4.5vw, 36px);
    color: var(--text-primary);
    margin: 0 0 18px;
    letter-spacing: 0.06em;
    line-height: 1.3;
    text-shadow: 0 0 22px rgba(124,109,245,0.4);
  }
  .hero p {
    font-family: "JetBrains Mono", monospace;
    font-size: 15px;
    color: var(--text-muted);
    max-width: 540px;
    margin: 0 auto 28px;
    line-height: 1.7;
  }
  .hero .scroll-tip {
    font-family: "Press Start 2P", monospace;
    font-size: 8px;
    color: var(--text-muted);
    margin-top: 36px;
    letter-spacing: 0.18em;
    animation: bob 1.6s ease-in-out infinite;
  }
  @keyframes bob { 0%,100%{transform:translateY(0);} 50%{transform:translateY(4px);} }

  /* ---------- SECTIONS ---------- */
  .section {
    position: relative; z-index: 1;
    padding: 56px clamp(20px, 5vw, 64px);
    max-width: 1200px;
    margin: 0 auto;
  }
  .section + .section { border-top: 1px solid var(--border-pixel); }

  /* ---------- SECTION HEADER (reusable component) ---------- */
  .sec-head {
    margin-bottom: 28px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border-pixel);
  }
  .sec-head .chapter {
    font-family: "Press Start 2P", monospace;
    font-size: 7px;
    color: var(--text-muted);
    letter-spacing: 0.18em;
    margin-bottom: 10px;
  }
  .sec-head .chapter .slash { color: var(--border-pixel); }
  .sec-head h2 {
    font-family: "Press Start 2P", monospace;
    font-size: clamp(16px, 2.6vw, 20px);
    color: var(--text-primary);
    margin: 0;
    letter-spacing: 0.05em;
    text-shadow: 0 0 14px rgba(124,109,245,0.3);
  }
  .sec-head h2.gold  { color: var(--accent-gold); text-shadow: 0 0 14px rgba(245,197,66,0.3); }
  .sec-head h2.teal  { color: var(--accent-teal); text-shadow: 0 0 14px rgba(61,214,172,0.3); }
  .sec-head .sub {
    font-family: "JetBrains Mono", monospace;
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 10px;
    line-height: 1.6;
    max-width: 600px;
  }

  /* ---------- COMPONENT GRID & SHOWCASE ---------- */
  .demo-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 18px;
  }
  .demo-card {
    background: var(--bg-surface);
    border: 2px solid var(--border-pixel);
    box-shadow: 0 0 0 1px var(--border-pixel);
    padding: 18px;
    border-radius: 2px;
    display: flex; flex-direction: column; gap: 16px;
    position: relative;
  }
  .demo-card .meta {
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border-pixel);
    padding-bottom: 10px;
  }
  .demo-card .meta .name {
    font-family: "Press Start 2P", monospace;
    font-size: 8px;
    color: var(--text-muted);
    letter-spacing: 0.12em;
  }
  .demo-card .meta .props {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    color: var(--accent-violet);
  }
  .demo-card .stage {
    display: flex; flex-direction: column; align-items: flex-start; gap: 12px;
    padding: 8px 4px 4px;
  }
  .demo-card .row {
    display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
  }

  /* ---------- BUTTONS ---------- */
  .pbtn {
    font-family: "Press Start 2P", monospace;
    font-size: 9px;
    letter-spacing: 0.08em;
    padding: 12px 14px;
    border-radius: 2px;
    cursor: pointer;
    transition: transform 120ms ease, box-shadow 150ms ease, background 150ms ease, color 150ms ease, filter 150ms ease;
    border: 2px solid var(--accent-violet);
    background: var(--accent-violet);
    color: var(--bg-base);
    box-shadow: 0 0 0 1px var(--accent-violet);
    display: inline-flex; align-items: center; gap: 8px;
    white-space: nowrap;
  }
  .pbtn:hover { box-shadow: 0 0 14px var(--accent-violet), 0 0 0 1px var(--accent-violet); filter: brightness(1.05); }
  .pbtn:active { transform: scale(0.97); }
  .pbtn.primary {
    border-color: var(--accent-gold);
    background: var(--accent-gold);
    box-shadow: 0 0 0 1px var(--accent-gold);
  }
  .pbtn.primary:hover { box-shadow: 0 0 14px var(--accent-gold), 0 0 0 1px var(--accent-gold); }
  .pbtn.secondary {
    background: transparent;
    color: var(--accent-violet);
    border-color: var(--accent-violet);
    box-shadow: 0 0 0 1px var(--accent-violet);
  }
  .pbtn.secondary:hover { box-shadow: 0 0 12px var(--accent-violet), 0 0 0 1px var(--accent-violet); }
  .pbtn.ghost {
    background: transparent;
    color: var(--text-muted);
    border-color: transparent;
    box-shadow: none;
    padding-left: 6px; padding-right: 6px;
  }
  .pbtn.ghost:hover { color: var(--text-primary); box-shadow: none; }
  .pbtn.danger {
    background: var(--accent-red);
    border-color: var(--accent-red);
    color: #ffffff;
    box-shadow: 0 0 0 1px var(--accent-red);
  }
  .pbtn.danger:hover { box-shadow: 0 0 14px var(--accent-red), 0 0 0 1px var(--accent-red); }
  .pbtn[disabled] {
    opacity: 0.45;
    cursor: not-allowed;
    box-shadow: 0 0 0 1px var(--border-pixel);
    border-color: var(--border-pixel);
    background: var(--bg-elevated);
    color: var(--text-muted);
  }
  .pbtn[disabled]:hover { box-shadow: 0 0 0 1px var(--border-pixel); filter: none; }

  /* ---------- DIALOGUE BOX ---------- */
  .dialogue {
    width: 100%;
    max-width: 520px;
    background: var(--bg-surface);
    border: 2px solid var(--accent-violet);
    box-shadow: 0 0 20px rgba(124,109,245,0.3), 0 0 0 1px var(--accent-violet);
    border-radius: 2px;
  }
  .dialogue.gold {
    border-color: var(--accent-gold);
    box-shadow: 0 0 20px rgba(245,197,66,0.3), 0 0 0 1px var(--accent-gold);
  }
  .dialogue.red {
    border-color: var(--accent-red);
    box-shadow: 0 0 20px rgba(245,92,92,0.3), 0 0 0 1px var(--accent-red);
  }
  .dialogue-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border-pixel);
  }
  .dialogue-head .name {
    font-family: "Press Start 2P", monospace;
    font-size: 10px;
    color: var(--accent-gold);
    letter-spacing: 0.04em;
  }
  .dialogue.red .dialogue-head .name { color: var(--accent-red); }
  .dialogue-head .lvl {
    font-family: "Press Start 2P", monospace;
    font-size: 10px;
    color: var(--accent-teal);
  }
  .dialogue-body {
    padding: 16px 18px;
    font-family: "JetBrains Mono", monospace;
    font-size: 13px;
    color: var(--text-primary);
    line-height: 1.8;
    position: relative;
  }
  .dialogue-body .blink {
    position: absolute; right: 14px; bottom: 8px;
    font-family: "Press Start 2P", monospace;
    font-size: 10px;
    color: var(--accent-violet);
    animation: blink 800ms ease-in-out infinite;
  }
  @keyframes blink {
    0%,49% { opacity: 1; }
    50%,100% { opacity: 0; }
  }

  /* ---------- TAGS ---------- */
  .ptag {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    color: var(--accent-violet);
    background: rgba(124,109,245,0.15);
    border: 1px solid var(--accent-violet);
    box-shadow: 0 0 0 1px var(--accent-violet);
    padding: 3px 7px;
    border-radius: 2px;
  }
  .ptag.plain {
    color: var(--text-muted);
    background: var(--bg-elevated);
    border-color: var(--border-pixel);
    box-shadow: 0 0 0 1px var(--border-pixel);
  }

  /* ---------- STATUS BADGES ---------- */
  .pbadge {
    font-family: "Press Start 2P", monospace;
    font-size: 7px;
    padding: 5px 8px;
    border-radius: 2px;
    letter-spacing: 0.1em;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .pbadge.shipped {
    color: var(--accent-teal);
    background: rgba(61,214,172,0.15);
    box-shadow: 0 0 0 1px var(--accent-teal);
  }
  .pbadge.wip {
    color: var(--accent-red);
    background: rgba(245,92,92,0.15);
    box-shadow: 0 0 0 1px var(--accent-red);
  }
  .pbadge.gold {
    color: var(--bg-base);
    background: var(--accent-gold);
    box-shadow: 0 0 0 1px var(--accent-gold);
  }
  .pbadge.muted {
    color: var(--text-muted);
    background: var(--bg-elevated);
    box-shadow: 0 0 0 1px var(--border-pixel);
  }

  /* ---------- 404 PREVIEW ---------- */
  .preview-404 {
    position: relative;
    min-height: 480px;
    border: 2px solid var(--border-pixel);
    box-shadow: 0 0 0 1px var(--border-pixel);
    overflow: hidden;
    border-radius: 2px;
    background: var(--bg-base);
    padding: 32px;
    display: flex; align-items: center; justify-content: center;
  }
  .preview-404 .stars-bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(1px 1px at 50px 60px, rgba(232,232,240,0.55), transparent 60%),
      radial-gradient(1.5px 1.5px at 220px 130px, rgba(232,232,240,0.4), transparent 60%),
      radial-gradient(1px 1px at 380px 280px, rgba(124,109,245,0.5), transparent 60%),
      radial-gradient(2px 2px at 500px 90px, rgba(245,197,66,0.45), transparent 60%),
      radial-gradient(1px 1px at 120px 220px, rgba(61,214,172,0.4), transparent 60%);
    background-size: 600px 400px;
    pointer-events: none;
  }
  .preview-404 .inner {
    position: relative; z-index: 1;
    text-align: center;
    max-width: 520px;
    display: flex; flex-direction: column; align-items: center; gap: 18px;
  }
  .preview-404 .err {
    font-family: "Press Start 2P", monospace;
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.16em;
  }
  .preview-404 h3 {
    font-family: "Press Start 2P", monospace;
    font-size: clamp(20px, 4vw, 28px);
    color: var(--accent-red);
    margin: 0;
    letter-spacing: 0.06em;
    text-shadow: 0 0 18px rgba(245,92,92,0.4);
    line-height: 1.2;
  }

  /* ---------- FOOTER ---------- */
  .footer {
    position: relative; z-index: 1;
    height: 60px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 clamp(20px, 5vw, 64px);
    background: var(--bg-surface);
    border-top: 1px solid var(--border-pixel);
  }
  .footer .left, .footer .right {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    color: var(--text-muted);
    display: flex; align-items: center; gap: 14px;
  }
  .footer .center {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.06em;
  }
  .footer .center .heart { color: var(--accent-red); }
  @media (max-width: 720px) { .footer .center { display: none; } }
  .footer a {
    color: var(--text-muted);
    display: inline-flex; align-items: center; justify-content: center;
    width: 20px; height: 20px;
    transition: color 150ms ease, transform 150ms ease;
    text-decoration: none;
  }
  .footer a:hover { color: var(--accent-violet); transform: translateY(-1px); }
  .footer svg { width: 18px; height: 18px; }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" data-presets="env,react">
    const { useState, useEffect, useRef } = React;

    // ---------- REUSABLE COMPONENTS ----------

    // SectionHeader: chapter label + title (variant) + subtitle + bottom rule
    function SectionHeader({ chapter, label, title, variant, sub }) {
      return (
        <div className="sec-head">
          {(chapter || label) && (
            <div className="chapter">
              {chapter && <>CHAPTER {chapter} <span className="slash">/</span> </>}
              {label}
            </div>
          )}
          <h2 className={variant || ""}>{title}</h2>
          {sub && <div className="sub">{sub}</div>}
        </div>
      );
    }

    // PixelButton: variant = primary | secondary | ghost | danger | violet (default)
    function PixelButton({ variant, children, disabled, onClick }) {
      const cls = "pbtn " + (variant || "");
      return (
        <button className={cls.trim()} disabled={disabled} onClick={onClick}>{children}</button>
      );
    }

    // DialogueBox
    function DialogueBox({ speaker, level, children, variant, showNext }) {
      return (
        <div className={"dialogue " + (variant || "")}>
          <div className="dialogue-head">
            <span className="name">▸ {speaker}</span>
            {level && <span className="lvl">[{level}]</span>}
          </div>
          <div className="dialogue-body">
            {children}
            {showNext && <span className="blink">[▼]</span>}
          </div>
        </div>
      );
    }

    // StackTag
    function StackTag({ variant, children }) {
      return <span className={"ptag " + (variant || "")}>{children}</span>;
    }

    // StatusBadge
    function StatusBadge({ variant, children }) {
      // variant: shipped | wip | gold | muted
      return <span className={"pbadge " + variant}>{children}</span>;
    }

    // ---------- NAV ----------
    const NAV_LINKS = [
      { key: "home",     label: "HOME",     href: "Home.html" },
      { key: "quests",   label: "QUESTS",   href: "Quest Board.html" },
      { key: "about",    label: "ABOUT",    href: "Character Sheet.html" },
      { key: "certs",    label: "CERTS",    href: "Achievement Cabinet.html" },
      { key: "log",      label: "LOG",      href: "Battle Log.html" },
      { key: "contact",  label: "CONTACT",  href: "#" },
    ];

    function Nav({ active }) {
      const [scrolled, setScrolled] = useState(false);
      const [open, setOpen] = useState(false);

      useEffect(() => {
        const onScroll = () => setScrolled(window.scrollY > 60);
        window.addEventListener("scroll", onScroll, { passive: true });
        onScroll();
        return () => window.removeEventListener("scroll", onScroll);
      }, []);

      useEffect(() => {
        document.body.style.overflow = open ? "hidden" : "";
        return () => { document.body.style.overflow = ""; };
      }, [open]);

      // demo hook: PREVIEW MENU button dispatches this event
      useEffect(() => {
        const h = () => setOpen(true);
        window.addEventListener("__demo_open_menu", h);
        return () => window.removeEventListener("__demo_open_menu", h);
      }, []);

      return (
        <>
          <header className={"nav " + (scrolled ? "scrolled" : "")}>
            <a className="brand" href="Home.html">
              <span className="avatar">RP</span>
              <span className="title">RAAJ.DEV</span>
            </a>

            <nav className="links">
              {NAV_LINKS.map(l => (
                <a key={l.key} href={l.href} className={l.key === active ? "active" : ""}>{l.label}</a>
              ))}
            </nav>

            <button className="cta">[ HIRE ME ]</button>

            <button className="hamburger" aria-label="Open menu" onClick={() => setOpen(true)}>
              <span className="bar"></span>
              <span className="bar"></span>
              <span className="bar"></span>
            </button>
          </header>

          <aside className={"mobile-menu " + (open ? "open" : "")} aria-hidden={!open}>
            <div className="top">
              <a className="brand" href="Home.html" onClick={() => setOpen(false)}>
                <span className="avatar" style={{width:28, height:28, fontSize:8}}>RP</span>
                <span className="title">RAAJ.DEV</span>
              </a>
              <button className="close" onClick={() => setOpen(false)} aria-label="Close menu">×</button>
            </div>
            <div className="links">
              {NAV_LINKS.map(l => (
                <a key={l.key} href={l.href} className={l.key === active ? "active" : ""} onClick={() => setOpen(false)}>
                  {l.label}
                </a>
              ))}
            </div>
            <div className="footer-line">[ HIRE ME ]   ·   raaj@inbox.dev</div>
          </aside>
        </>
      );
    }

    // ---------- FOOTER ----------
    const SocialIcons = {
      github: (
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 .5C5.7.5.6 5.6.6 11.9c0 5 3.3 9.3 7.8 10.8.6.1.8-.2.8-.6v-2.2c-3.2.7-3.9-1.4-3.9-1.4-.5-1.3-1.3-1.7-1.3-1.7-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.7 1.3 3.4 1 .1-.8.4-1.3.8-1.6-2.6-.3-5.3-1.3-5.3-5.8 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.2 1.2.9-.3 1.9-.4 2.9-.4s2 .1 2.9.4c2.2-1.5 3.2-1.2 3.2-1.2.6 1.6.2 2.8.1 3.1.7.8 1.2 1.9 1.2 3.1 0 4.5-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.2c0 .3.2.7.8.6 4.5-1.5 7.8-5.8 7.8-10.8C23.4 5.6 18.3.5 12 .5z"/>
        </svg>
      ),
      linkedin: (
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M4.98 3.5C4.98 4.88 3.87 6 2.5 6S0 4.88 0 3.5 1.12 1 2.5 1s2.48 1.12 2.48 2.5zM.22 8h4.56v14H.22V8zm7.4 0h4.37v1.92h.07c.61-1.15 2.1-2.36 4.32-2.36 4.62 0 5.47 3.04 5.47 7v7.44h-4.56v-6.6c0-1.57-.03-3.59-2.19-3.59-2.2 0-2.53 1.72-2.53 3.49V22H7.62V8z"/>
        </svg>
      ),
      twitter: (
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M18.244 2H21.5l-7.5 8.57L23 22h-6.844l-5.36-7.012L4.6 22H1.34l8.02-9.165L1 2h7.02l4.85 6.41L18.244 2zm-1.2 18h1.9L7.06 4H5.06l11.984 16z"/>
        </svg>
      ),
    };

    function Footer() {
      return (
        <footer className="footer">
          <div className="left">© 2026 RAAJ PATRE</div>
          <div className="center">BUILT WITH <span className="heart">♥</span> AND TOO MUCH COFFEE</div>
          <div className="right">
            <a href="#" aria-label="GitHub" title="GitHub">{SocialIcons.github}</a>
            <a href="#" aria-label="LinkedIn" title="LinkedIn">{SocialIcons.linkedin}</a>
            <a href="#" aria-label="Twitter" title="Twitter">{SocialIcons.twitter}</a>
          </div>
        </footer>
      );
    }

    // ---------- 404 ----------
    function NotFound() {
      return (
        <div className="preview-404">
          <div className="stars-bg" aria-hidden="true"></div>
          <div className="inner">
            <div className="err">ERR_404</div>
            <h3>QUEST NOT FOUND</h3>
            <DialogueBox speaker="SYSTEM" level="WARN" variant="red">
              The page you're looking for doesn't exist in this realm.<br/>
              Recheck the path, or return to town and try a different route.
            </DialogueBox>
            <PixelButton variant="primary">↩  RETURN TO TOWN</PixelButton>
          </div>
        </div>
      );
    }

    // ---------- APP / SHOWCASE ----------
    function App() {
      return (
        <>
          <Nav active="home" />

          {/* Hero */}
          <section className="hero">
            <div className="stars-hero" aria-hidden="true"></div>
            <div className="hero-inner">
              <div className="hero-eyebrow">▸ COMPONENT KIT</div>
              <h1>SHARED UI · NAV · FOOTER · 404</h1>
              <p>
                The reusable system behind every page. Buttons, dialogue boxes, tags,
                badges, and section headers — drop them into any page to keep the
                pixel-RPG language consistent across the portfolio.
              </p>
              <div className="row" style={{justifyContent: "center", flexWrap: "wrap", gap: 12}}>
                <PixelButton variant="primary">[ VIEW QUESTS ]</PixelButton>
                <PixelButton variant="secondary">[ DOWNLOAD RESUME ]</PixelButton>
                <PixelButton variant="ghost">[ SKIP INTRO ]</PixelButton>
              </div>
              <div className="scroll-tip">▼  SCROLL TO INSPECT  ▼</div>
            </div>
          </section>

          {/* Section Header */}
          <section className="section">
            <SectionHeader
              chapter="01"
              label="ATOMS"
              title="SECTION HEADER"
              sub="The chapter eyebrow, large pixel title, and a thin bottom rule. Variants below switch the title's accent color and glow."
            />
            <div className="demo-grid">
              <div className="demo-card">
                <div className="meta"><span className="name">VIOLET (DEFAULT)</span><span className="props">variant=""</span></div>
                <div className="stage"><SectionHeader chapter="03" label="FACTIONS" title="FACTIONS" /></div>
              </div>
              <div className="demo-card">
                <div className="meta"><span className="name">GOLD</span><span className="props">variant="gold"</span></div>
                <div className="stage"><SectionHeader label="★ FEATURED" title="QUEST BOARD" variant="gold" /></div>
              </div>
              <div className="demo-card">
                <div className="meta"><span className="name">TEAL</span><span className="props">variant="teal"</span></div>
                <div className="stage"><SectionHeader label="◆ STATS" title="PLAYER STATS" variant="teal" /></div>
              </div>
            </div>
          </section>

          {/* Buttons */}
          <section className="section">
            <SectionHeader
              chapter="02"
              label="BUTTONS"
              title="PIXEL BUTTONS"
              variant="gold"
              sub="Press Start 2P, pixel borders, glow on hover, scale(0.97) on press. Four variants plus a disabled state."
            />
            <div className="demo-grid">
              <div className="demo-card">
                <div className="meta"><span className="name">PRIMARY (GOLD)</span><span className="props">variant="primary"</span></div>
                <div className="stage">
                  <PixelButton variant="primary">[ VIEW QUESTS ]</PixelButton>
                  <PixelButton variant="primary">↩  RETURN TO TOWN</PixelButton>
                </div>
              </div>
              <div className="demo-card">
                <div className="meta"><span className="name">SECONDARY</span><span className="props">variant="secondary"</span></div>
                <div className="stage">
                  <PixelButton variant="secondary">[ DOWNLOAD RESUME ]</PixelButton>
                  <PixelButton variant="secondary">▸ INSPECT</PixelButton>
                </div>
              </div>
              <div className="demo-card">
                <div className="meta"><span className="name">GHOST</span><span className="props">variant="ghost"</span></div>
                <div className="stage">
                  <PixelButton variant="ghost">[ SKIP INTRO ]</PixelButton>
                  <PixelButton variant="ghost">CANCEL</PixelButton>
                </div>
              </div>
              <div className="demo-card">
                <div className="meta"><span className="name">DANGER</span><span className="props">variant="danger"</span></div>
                <div className="stage">
                  <PixelButton variant="danger">[ DELETE SAVE ]</PixelButton>
                  <PixelButton variant="danger">ABANDON QUEST</PixelButton>
                </div>
              </div>
              <div className="demo-card">
                <div className="meta"><span className="name">VIOLET (DEFAULT)</span><span className="props">variant=""</span></div>
                <div className="stage">
                  <PixelButton>▶  ENTER PORTFOLIO</PixelButton>
                  <PixelButton>[ NEW GAME ]</PixelButton>
                </div>
              </div>
              <div className="demo-card">
                <div className="meta"><span className="name">DISABLED</span><span className="props">disabled</span></div>
                <div className="stage">
                  <PixelButton variant="primary" disabled>[ LOCKED ]</PixelButton>
                  <PixelButton variant="secondary" disabled>QUEST UNAVAILABLE</PixelButton>
                </div>
              </div>
            </div>
          </section>

          {/* Dialogue box */}
          <section className="section">
            <SectionHeader
              chapter="03"
              label="DIALOGUE"
              title="DIALOGUE BOX"
              sub="Reusable speech-bubble with a name row + body. Used in the Welcome Screen, 404 page, and any narrative beat. Pass speaker, level, variant."
            />
            <div className="demo-grid">
              <div className="demo-card">
                <div className="meta"><span className="name">DEFAULT (VIOLET)</span><span className="props">speaker level showNext</span></div>
                <div className="stage">
                  <DialogueBox speaker="RAAJ PATRE" level="LVL 2" showNext>
                    Hey. I'm Raaj.<br/>
                    Builder. Breaker. Repeat.<br/><br/>
                    I build things for the web — and occasionally break them in interesting ways.
                  </DialogueBox>
                </div>
              </div>
              <div className="demo-card">
                <div className="meta"><span className="name">GOLD</span><span className="props">variant="gold"</span></div>
                <div className="stage">
                  <DialogueBox speaker="QUESTGIVER" level="LVL ??" variant="gold" showNext>
                    A new quest has appeared on the board.<br/>
                    Will you accept it, adventurer?
                  </DialogueBox>
                </div>
              </div>
              <div className="demo-card">
                <div className="meta"><span className="name">RED (ALERT)</span><span className="props">variant="red"</span></div>
                <div className="stage">
                  <DialogueBox speaker="SYSTEM" level="WARN" variant="red">
                    The page you're looking for doesn't exist in this realm.
                  </DialogueBox>
                </div>
              </div>
            </div>
          </section>

          {/* Tags + Badges */}
          <section className="section">
            <SectionHeader
              chapter="04"
              label="LABELS"
              title="TAGS & BADGES"
              variant="teal"
              sub="Stack tags appear on every project card. Status badges mark SHIPPED / IN-PROGRESS / LEGENDARY. Tiny, monospace, pixel-bordered."
            />
            <div className="demo-grid">
              <div className="demo-card">
                <div className="meta"><span className="name">STACK TAGS · DEFAULT</span><span className="props">{"<StackTag>"}</span></div>
                <div className="stage">
                  <div className="row">
                    <StackTag>React</StackTag>
                    <StackTag>Next.js</StackTag>
                    <StackTag>Postgres</StackTag>
                    <StackTag>TypeScript</StackTag>
                    <StackTag>Tailwind</StackTag>
                  </div>
                </div>
              </div>
              <div className="demo-card">
                <div className="meta"><span className="name">STACK TAGS · PLAIN</span><span className="props">variant="plain"</span></div>
                <div className="stage">
                  <div className="row">
                    <StackTag variant="plain">+3 more</StackTag>
                    <StackTag variant="plain">archived</StackTag>
                    <StackTag variant="plain">draft</StackTag>
                  </div>
                </div>
              </div>
              <div className="demo-card">
                <div className="meta"><span className="name">STATUS BADGES</span><span className="props">{"<StatusBadge variant>"}</span></div>
                <div className="stage">
                  <div className="row">
                    <StatusBadge variant="shipped">◆ SHIPPED</StatusBadge>
                    <StatusBadge variant="wip">▶ IN PROGRESS</StatusBadge>
                  </div>
                  <div className="row">
                    <StatusBadge variant="gold">★ LEGENDARY</StatusBadge>
                    <StatusBadge variant="muted">◇ DRAFT</StatusBadge>
                  </div>
                </div>
              </div>
            </div>
          </section>

          {/* 404 */}
          <section className="section">
            <SectionHeader
              chapter="05"
              label="ERROR STATE"
              title="404 — QUEST NOT FOUND"
              sub="Reuses the dialogue box + primary button. Star field continues the home page's visual language so the user knows they haven't left the realm."
            />
            <NotFound />
          </section>

          {/* Nav state ref */}
          <section className="section">
            <SectionHeader
              chapter="06"
              label="GLOBAL"
              title="NAV BEHAVIOR"
              variant="gold"
              sub="The nav at the top of this page is the live component. Scroll up: it goes transparent over the hero. Scroll past the welcome area: it solidifies with a backdrop blur. Resize narrow: links collapse into a hamburger that opens a full-screen menu."
            />
            <div className="demo-grid">
              <div className="demo-card">
                <div className="meta"><span className="name">SCROLL BEHAVIOR</span><span className="props">.nav.scrolled</span></div>
                <div className="stage">
                  <div style={{fontFamily: '"JetBrains Mono", monospace', fontSize: 13, color: "var(--text-muted)", lineHeight: 1.7}}>
                    <strong style={{color: "var(--text-primary)"}}>top</strong> → transparent, no border, no blur.<br/>
                    <strong style={{color: "var(--text-primary)"}}>scrolled &gt; 60px</strong> → background <code style={{color:"var(--accent-violet)"}}>rgba(--bg-surface, 0.9)</code> + 1px pixel border + backdrop-filter blur(8).
                  </div>
                </div>
              </div>
              <div className="demo-card">
                <div className="meta"><span className="name">LINK CURSOR</span><span className="props">.nav .links a:hover</span></div>
                <div className="stage">
                  <div style={{fontFamily: '"JetBrains Mono", monospace', fontSize: 13, color: "var(--text-muted)", lineHeight: 1.7}}>
                    Hover any nav link to see a 4×4 violet pixel cursor blink next to the label. Active link gets a 2px violet underline.
                  </div>
                </div>
              </div>
              <div className="demo-card">
                <div className="meta"><span className="name">MOBILE MENU</span><span className="props">.mobile-menu.open</span></div>
                <div className="stage">
                  <div style={{fontFamily: '"JetBrains Mono", monospace', fontSize: 13, color: "var(--text-muted)", lineHeight: 1.7}}>
                    &lt;820px: links + CTA collapse. Hamburger opens a full-screen overlay sliding in from the right (250ms ease).
                  </div>
                  <PixelButton variant="secondary" onClick={() => {
                    const ev = new Event("__demo_open_menu");
                    window.dispatchEvent(ev);
                  }}>▸ PREVIEW MENU</PixelButton>
                </div>
              </div>
            </div>
          </section>

          <Footer />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
